<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日工作日誌 - 戰情室 (整合任務版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Microsoft YaHei', 'Microsoft JhengHei', 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            transition: all 0.3s ease;
        }
        .timeline-item {
            position: relative;
            padding-left: 2.5rem;
            padding-bottom: 1.5rem;
            border-left: 2px solid #334155;
        }
        .timeline-item:last-child { border-left: 2px solid transparent; }
        .timeline-dot {
            position: absolute;
            left: -10px;
            top: 0;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #0f172a;
            border: 2px solid #334155;
            box-shadow: 0 0 0 3px #1e293b;
        }
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a;
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
        }
    </style>
</head>
<body>

    <div id="loading-overlay" class="loading-overlay">
        <div class="text-center">
            <svg class="animate-spin mx-auto h-10 w-10 text-cyan-400 mb-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
            <p class="text-gray-400">正在連線至 Firebase (daily-23c82)...</p>
            <p id="error-display" class="text-red-500 mt-4 text-sm hidden"></p>
        </div>
    </div>

    <div class="container mx-auto p-4 max-w-7xl" id="app-container" style="display: none;">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 bg-slate-800 p-6 rounded-xl card border-cyan-400 border-l-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-widest text-cyan-400">每日工作日誌戰情室</h1>
                <p class="text-gray-400 mt-1 flex items-center text-sm">
                    <span id="header-date" class="font-mono"></span>
                    <span class="mx-2">|</span>
                    <span id="user-id-display" class="text-indigo-400 font-bold">載入中...</span>
                </p>
            </div>
            <div class="mt-4 md:mt-0 flex space-x-2 no-print">
                <button onclick="exportTasksJSON()" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs transition">匯出配置</button>
                <button onclick="document.getElementById('import-file').click()" class="bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-lg text-xs transition">匯入配置</button>
                <input type="file" id="import-file" class="hidden" accept=".json" onchange="importTasksJSON(event)">
                <button onclick="showHistoryModal()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm transition">歷史紀錄</button>
                <button onclick="showUserSettingsModal()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm transition">帳號設定</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- 左側分析 -->
            <div class="lg:col-span-4 space-y-6">
                <div class="card p-6">
                    <h2 class="text-lg font-bold text-cyan-400 mb-4 border-b border-slate-700 pb-2">任務分佈 (今日)</h2>
                    <div class="relative h-48">
                        <canvas id="workChart"></canvas>
                        <div id="chart-placeholder" class="absolute inset-0 flex items-center justify-center bg-slate-800/80 text-gray-500 text-sm hidden">尚無資料</div>
                    </div>
                </div>
            </div>

            <!-- 右側任務區域 -->
            <div class="lg:col-span-8 space-y-6">
                <div class="card p-6 no-print">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                        <h2 class="text-xl font-bold text-cyan-400">[MISSION CENTER] 任務中心</h2>
                        <button onclick="resetMonthlyStatus()" class="text-[10px] bg-red-900/30 text-red-400 px-2 py-1 rounded hover:bg-red-900/50 transition">重置每月任務</button>
                    </div>

                    <div id="task-accordion" class="space-y-3 mb-6"></div>

                    <div class="border-t border-slate-700 pt-4">
                        <button onclick="document.getElementById('add-task-form').classList.toggle('hidden')" class="w-full py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm transition">+ 管理任務清單</button>
                        <div id="add-task-form" class="hidden mt-3 p-4 bg-slate-900 border border-slate-700 rounded-lg space-y-2">
                            <div class="grid grid-cols-2 gap-2">
                                <input type="text" id="new-task-category" placeholder="類別 (如: ERP)" class="p-2 bg-slate-800 border border-slate-700 rounded text-sm text-white">
                                <select id="new-task-freq" class="p-2 bg-slate-800 border border-slate-700 rounded text-sm text-cyan-400">
                                    <option value="daily">每日任務</option>
                                    <option value="monthly">每月任務</option>
                                </select>
                            </div>
                            <input type="text" id="new-task-name" placeholder="任務名稱" class="w-full p-2 bg-slate-800 border border-slate-700 rounded text-sm text-white">
                            <input type="text" id="new-task-notes" placeholder="備註 (選填)" class="w-full p-2 bg-slate-800 border border-slate-700 rounded text-sm text-white">
                            <button onclick="addTask()" class="w-full bg-cyan-600 hover:bg-cyan-500 py-2 rounded font-bold transition">儲存任務</button>
                        </div>
                    </div>
                </div>

                <div class="card p-6 min-h-[400px]">
                    <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-2">
                        <h2 class="text-xl font-bold text-indigo-400">今日日誌時間軸</h2>
                        <span id="log-count-badge" class="text-xs text-slate-500 font-mono">0 ENTRIES</span>
                    </div>
                    <div id="daily-log-timeline"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals -->
    <div id="user-settings-modal" class="modal-overlay hidden">
        <div class="bg-slate-800 p-6 rounded-xl w-full max-w-md shadow-2xl border border-slate-700">
            <h3 class="text-xl font-bold text-cyan-400 mb-4">帳號設定</h3>
            <div class="space-y-4">
                <div class="bg-slate-900 p-3 rounded">
                    <p class="text-xs text-gray-500 uppercase">當前 UID</p>
                    <p id="modal-current-user-id" class="font-mono text-green-400 break-all"></p>
                </div>
                <button onclick="document.getElementById('user-settings-modal').classList.add('hidden')" class="w-full py-2 bg-slate-700 rounded">關閉</button>
            </div>
        </div>
    </div>

    <div id="history-modal" class="modal-overlay hidden">
        <div class="bg-slate-800 p-0 rounded-xl w-full max-w-4xl flex flex-col max-h-[85vh] shadow-2xl overflow-hidden">
            <div class="bg-indigo-600 p-4 flex justify-between items-center text-white">
                <h2 class="font-bold">歷史紀錄查詢</h2>
                <button onclick="document.getElementById('history-modal').classList.add('hidden')" class="text-2xl">&times;</button>
            </div>
            <div class="p-4 bg-slate-700 flex items-center space-x-4">
                <input type="date" id="history-date-picker" class="p-2 bg-slate-900 border border-slate-600 rounded">
                <button onclick="fetchHistory()" class="bg-cyan-600 px-6 py-2 rounded font-bold">查詢</button>
            </div>
            <div id="history-log-entries" class="p-6 overflow-y-auto flex-1 bg-slate-900/50"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, getDocs, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // Firebase 配置 (daily-23c82)
        // ==========================================
        let LOCAL_FIREBASE_CONFIG = {
            apiKey: "AIzaSyAXnSDK_kY4Aa8XvL0M_Md9kA4Wdow_Uvs",
            authDomain: "daily-23c82.firebaseapp.com",
            projectId: "daily-23c82",
            storageBucket: "daily-23c82.firebasestorage.app",
            messagingSenderId: "574719251457",
            appId: "1:574719251457:web:30aadb364406783b175c00",
            measurementId: "G-6JN0N6BJHH"
        };

        let firebaseConfig = (typeof __firebase_config !== 'undefined' && __firebase_config !== 'null' && __firebase_config.length > 2) 
            ? JSON.parse(__firebase_config) 
            : LOCAL_FIREBASE_CONFIG; 

        const appId = 'war-room-v2';
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        let dataUserId = null;
        let allTasks = []; 
        let completedToday = new Set();
        let monthlyStatus = {};
        let dailyLogs = [];
        let workChart = null;
        let openCategories = new Set();

        const getTodayStr = () => new Date().toISOString().split('T')[0];

        const startApp = (user) => {
            dataUserId = user.uid;
            document.getElementById('user-id-display').textContent = `ID: ${dataUserId}`;
            document.getElementById('header-date').textContent = getTodayStr().replace(/-/g, '/');
            initChart();
            
            // 監聽任務清單
            onSnapshot(doc(db, 'artifacts', appId, 'users', dataUserId, 'config', 'tasks_v2'), (s) => {
                allTasks = s.exists() ? s.data().tasks : [];
                renderTasks();
            });

            // 監聽每月任務狀態
            onSnapshot(doc(db, 'artifacts', appId, 'users', dataUserId, 'config', 'monthly_status'), (s) => {
                monthlyStatus = s.exists() ? s.data() : {};
                renderTasks();
            });

            // 監聽今日日誌
            onSnapshot(collection(db, 'artifacts', appId, 'users', dataUserId, 'daily_logs', getTodayStr(), 'entries'), (s) => {
                dailyLogs = [];
                completedToday.clear();
                s.forEach(d => {
                    const data = d.data();
                    dailyLogs.push({ id: d.id, ...data });
                    if (data.taskName) completedToday.add(data.taskName);
                });
                dailyLogs.sort((a,b) => b.timestamp - a.timestamp);
                renderTasks();
                renderTimeline(dailyLogs, document.getElementById('daily-log-timeline'));
                updateChart();
            });

            document.getElementById('loading-overlay').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
        };

        window.addTask = async () => {
            const freq = document.getElementById('new-task-freq').value;
            const cat = document.getElementById('new-task-category').value.trim() || '未分類';
            const name = document.getElementById('new-task-name').value.trim();
            const notes = document.getElementById('new-task-notes').value.trim();
            if (!name) return;
            const updated = [...allTasks, { name, category: cat, notes, freq }];
            await setDoc(doc(db, 'artifacts', appId, 'users', dataUserId, 'config', 'tasks_v2'), { tasks: updated });
            document.getElementById('new-task-name').value = '';
            document.getElementById('new-task-notes').value = '';
        };

        window.toggleTask = async (name, cat, freq) => {
            const isMonthly = freq === 'monthly';
            const now = new Date();
            const dateSuffix = ` (${now.getMonth() + 1}/${now.getDate()})`;
            const desc = isMonthly ? `[每月任務] 完成: ${name}` : `[每日任務] 完成: ${name}`;

            try {
                // 寫入日誌
                await addDoc(collection(db, 'artifacts', appId, 'users', dataUserId, 'daily_logs', getTodayStr(), 'entries'), {
                    type: isMonthly ? 'Monthly' : 'Routine', 
                    taskName: name, 
                    category: cat, 
                    description: desc,
                    timestamp: Date.now(),
                    timeString: now.toLocaleTimeString('zh-TW', { hour12: false })
                });

                // 如果是每月任務，更新長期狀態
                if (isMonthly) {
                    const newStatus = { ...monthlyStatus, [name]: { time: Date.now(), dateText: dateSuffix } };
                    await setDoc(doc(db, 'artifacts', appId, 'users', dataUserId, 'config', 'monthly_status'), newStatus);
                }
            } catch (e) { console.error("Toggle Task Error:", e); }
        };

        const renderTasks = () => {
            const container = document.getElementById('task-accordion');
            container.innerHTML = '';
            if (allTasks.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-600 italic">尚無任務，請展開下方管理介面新增。</div>`;
                return;
            }

            const grouped = allTasks.reduce((acc, t) => {
                if (!acc[t.category]) acc[t.category] = [];
                acc[t.category].push(t);
                return acc;
            }, {});

            Object.entries(grouped).forEach(([cat, tasks], idx) => {
                const isOpened = openCategories.has(cat);
                const doneCount = tasks.filter(t => t.freq === 'monthly' ? !!monthlyStatus[t.name] : completedToday.has(t.name)).length;
                const percent = Math.round((doneCount / tasks.length) * 100);

                const section = document.createElement('div');
                section.className = "border border-slate-700 rounded-lg overflow-hidden mb-2";
                section.innerHTML = `
                    <button class="w-full flex items-center justify-between p-3 bg-slate-800 hover:bg-slate-750 transition relative" onclick="window.toggleCat('${cat}')">
                        <div class="absolute inset-0 bg-cyan-500/5 pointer-events-none" style="width: ${percent}%"></div>
                        <span class="relative font-bold text-gray-200">${cat}</span>
                        <div class="relative flex items-center space-x-2">
                            <span class="text-xs font-mono text-cyan-400">${doneCount}/${tasks.length}</span>
                            <svg class="w-4 h-4 transform transition ${isOpened ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2"/></svg>
                        </div>
                    </button>
                    <div class="p-2 space-y-1 bg-slate-900/30 ${isOpened ? '' : 'hidden'}"></div>
                `;
                container.appendChild(section);

                const list = section.lastElementChild;
                tasks.forEach(t => {
                    const isMonthly = t.freq === 'monthly';
                    const isDone = isMonthly ? !!monthlyStatus[t.name] : completedToday.has(t.name);
                    const baseColor = isMonthly ? 'emerald' : 'cyan';
                    const item = document.createElement('div');
                    item.className = `flex items-center justify-between p-3 border-2 rounded-lg transition ${isDone ? `border-${baseColor}-600/30 bg-${baseColor}-900/10 opacity-60` : 'border-slate-800 hover:border-slate-600 bg-slate-800/40'}`;
                    item.innerHTML = `
                        <div class="flex items-center space-x-3 truncate">
                            <input type="checkbox" ${isDone ? 'checked disabled' : ''} onchange="window.toggleTask('${t.name}', '${cat}', '${t.freq || 'daily'}')" class="h-5 w-5 rounded border-gray-600 bg-gray-800 text-${baseColor}-500 cursor-pointer">
                            <div class="truncate">
                                <span class="text-[10px] font-bold px-1.5 py-0.5 rounded mr-2 ${isMonthly ? 'bg-emerald-900 text-emerald-400' : 'bg-cyan-900 text-cyan-400'}">${isMonthly ? '每月' : '每日'}</span>
                                <span class="${isDone ? 'line-through text-gray-500' : 'text-gray-100'} font-medium">
                                    ${t.name}${isMonthly && isDone ? `<span class="text-xs ml-1 text-emerald-500 font-mono">${monthlyStatus[t.name].dateText}</span>` : ""}
                                </span>
                                ${t.notes ? `<p class="text-[10px] text-gray-500 truncate mt-0.5">${t.notes}</p>` : ''}
                            </div>
                        </div>
                        ${!isDone ? `<button onclick="window.deleteTaskItem('${t.name}')" class="text-slate-600 hover:text-red-500 px-2">&times;</button>` : ''}
                    `;
                    list.appendChild(item);
                });
            });
        };

        window.toggleCat = (cat) => {
            if (openCategories.has(cat)) openCategories.delete(cat);
            else openCategories.add(cat);
            renderTasks();
        };

        window.deleteTaskItem = async (name) => {
            if (!confirm(`確定要從清單中移除任務「${name}」？`)) return;
            const updated = allTasks.filter(t => t.name !== name);
            await setDoc(doc(db, 'artifacts', appId, 'users', dataUserId, 'config', 'tasks_v2'), { tasks: updated });
        };

        window.resetMonthlyStatus = async () => {
            if (!confirm("此操作將清除所有『每月任務』的完成狀態，確定嗎？")) return;
            await setDoc(doc(db, 'artifacts', appId, 'users', dataUserId, 'config', 'monthly_status'), {});
        };

        window.exportTasksJSON = () => {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allTasks, null, 2));
            const dl = document.createElement('a');
            dl.setAttribute("href", dataStr);
            dl.setAttribute("download", `war_room_tasks_${getTodayStr()}.json`);
            dl.click();
        };

        window.importTasksJSON = (event) => {
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        await setDoc(doc(db, 'artifacts', appId, 'users', dataUserId, 'config', 'tasks_v2'), { tasks: imported });
                        alert("匯入成功！");
                    }
                } catch(err) { alert("JSON 格式錯誤"); }
            };
            reader.readAsText(event.target.files[0]);
        };

        const renderTimeline = (logs, container) => {
            container.innerHTML = logs.length ? '' : `<div class="py-20 text-center text-slate-700 italic">今日尚未有任何任務日誌</div>`;
            logs.forEach(log => {
                const color = log.type === 'Monthly' ? 'emerald' : (log.type === 'AdHoc' ? 'red' : 'indigo');
                const div = document.createElement('div');
                div.className = 'timeline-item';
                div.innerHTML = `
                    <div class="timeline-dot border-${color}-600 bg-${color}-500"></div>
                    <div class="card p-3 flex justify-between items-center">
                        <div>
                            <p class="text-sm font-bold text-gray-200">${log.description}</p>
                            <p class="text-[10px] text-slate-500 uppercase">${log.category} | ${log.type}</p>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-xs font-mono text-cyan-400">${log.timeString}</span>
                            <button onclick="window.deleteLog('${log.id}')" class="text-slate-600 hover:text-red-500 transition">&times;</button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
            document.getElementById('log-count-badge').textContent = `${logs.length} ENTRIES`;
        };

        window.deleteLog = async (id) => {
            if(!confirm("確定刪除此日誌項目？(這會讓今日任務回復可勾選狀態)")) return;
            await deleteDoc(doc(db, 'artifacts', appId, 'users', dataUserId, 'daily_logs', getTodayStr(), 'entries', id));
        };

        const initChart = () => {
            const ctx = document.getElementById('workChart').getContext('2d');
            workChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['已完成', '待處理'], datasets: [{ data: [0, 1], backgroundColor: ['#06b6d4', '#334155'], borderWidth: 0 }] },
                options: { cutout: '80%', plugins: { legend: { display: false } }, responsive: true, maintainAspectRatio: false }
            });
        };

        const updateChart = () => {
            const dailyTasks = allTasks.filter(t => t.freq !== 'monthly');
            if (dailyTasks.length === 0) {
                document.getElementById('chart-placeholder').classList.remove('hidden');
                return;
            }
            document.getElementById('chart-placeholder').classList.add('hidden');
            const done = completedToday.size;
            const remaining = Math.max(0, dailyTasks.length - done);
            workChart.data.datasets[0].data = [done, remaining];
            workChart.update();
        };

        window.showUserSettingsModal = () => {
            document.getElementById('modal-current-user-id').textContent = dataUserId;
            document.getElementById('user-settings-modal').classList.remove('hidden');
        };

        window.fetchHistory = async () => {
            const date = document.getElementById('history-date-picker').value;
            if (!date) return;
            const q = query(collection(db, 'artifacts', appId, 'users', dataUserId, 'daily_logs', date, 'entries'), orderBy('timestamp', 'desc'));
            const s = await getDocs(q);
            const logs = [];
            s.forEach(d => logs.push({ id: d.id, ...d.data() }));
            renderTimeline(logs, document.getElementById('history-log-entries'));
        };

        window.showHistoryModal = () => {
            document.getElementById('history-modal').classList.remove('hidden');
            document.getElementById('history-date-picker').value = getTodayStr();
        };

        // 登入與初始化
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                startApp(user);
            } else {
                try {
                    await signInAnonymously(auth);
                } catch (e) {
                    console.error("Auth Error:", e);
                    document.getElementById('error-display').textContent = "連線失敗，請確認網路環境或 Firebase API 限制。";
                    document.getElementById('error-display').classList.remove('hidden');
                }
            }
        });
    </script>
</body>
</html>
