    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query, where, addDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let LOCAL_FIREBASE_CONFIG = {
            apiKey: "AIzaSyAXnSDK_kY4Aa8XvL0M_Md9kA4Wdow_Uvs", projectId: "daily-23c82",
            authDomain: "daily-23c82.firebaseapp.com", storageBucket: "daily-23c82.firebasestorage.app",
            messagingSenderId: "574719251457", appId: "1:574719251457:web:30aadb364406783b175c00"
        };

        let firebaseConfig = (typeof __firebase_config !== 'undefined' && __firebase_config !== 'null' && __firebase_config.length > 2) 
            ? JSON.parse(__firebase_config) : LOCAL_FIREBASE_CONFIG; 

        let app, db, auth, authUserId = null, dataUserId = null, isAuthReady = false;
        let routineTasks = [], completedRoutineTaskNames = new Set(), monthlyTaskStatus = {}, dailyLogs = [], statsChart = null;
        let unsubscribeRoutine = null, unsubscribeLogs = null, unsubscribeMonthlyStatus = null;
        let openCategories = new Set(); 

        Chart.defaults.color = '#e2e8f0'; 
        Chart.defaults.font.family = 'Microsoft YaHei, Microsoft JhengHei, Inter, sans-serif'; 

        // --- Core Functions ---
        const getRoutineTasksDocRef = () => dataUserId ? doc(db, 'artifacts', appId, 'users', dataUserId, 'config', 'routine_tasks') : null;
        const getMonthlyStatusDocRef = () => dataUserId ? doc(db, 'artifacts', appId, 'users', dataUserId, 'config', 'monthly_status') : null;
        const getDailyLogCollectionRef = (dateString = getTodayDateString()) => dataUserId ? collection(db, 'artifacts', appId, 'users', dataUserId, 'daily_logs', dateString, 'entries') : null;
        const getTodayDateString = () => new Date().toISOString().split('T')[0];
        const formatDisplayDate = (dateStr) => dateStr.replace(/-/g, '/');

        // --- Edit Tasks & Categories (NEW) ---
        window.editCategory = (event, oldCategory) => {
            event.stopPropagation();
            const newCategory = prompt(`請輸入類別「${oldCategory}」的新名稱:`, oldCategory);
            if (!newCategory || newCategory.trim() === "" || newCategory === oldCategory) return;

            const updatedTasks = routineTasks.map(task => 
                task.category === oldCategory ? { ...task, category: newCategory.trim() } : task
            );
            
            if (openCategories.has(oldCategory)) {
                openCategories.delete(oldCategory);
                openCategories.add(newCategory.trim());
            }
            saveRoutineTasks(updatedTasks);
        };

        window.editRoutineTask = (taskName) => {
            const task = routineTasks.find(t => t.name === taskName);
            if (!task) return;

            const newName = prompt(`編輯任務名稱:`, task.name);
            if (!newName || newName.trim() === "") return;
            
            // 檢查重複 (除非是自己)
            if (newName !== task.name && routineTasks.some(t => t.name === newName)) {
                alert("任務名稱已存在");
                return;
            }

            const newNotes = prompt(`編輯備註:`, task.notes || "");
            const newFreq = confirm(`任務頻率是否設為「每月」(Monthly)？\n(取消則設為「每日」Daily)`) ? "Monthly" : "Daily";

            const updatedTasks = routineTasks.map(t => 
                t.name === taskName ? { ...t, name: newName.trim(), notes: newNotes, frequency: newFreq } : t
            );

            // 如果改了名字且有每月狀態，遷移狀態
            if (newName !== taskName && monthlyTaskStatus[taskName]) {
                const newStatus = { ...monthlyTaskStatus };
                newStatus[newName] = newStatus[taskName];
                delete newStatus[taskName];
                setDoc(getMonthlyStatusDocRef(), newStatus);
            }

            saveRoutineTasks(updatedTasks);
        };

        // --- Other Logic ---
        const initChart = () => {
            if (statsChart) statsChart.destroy();
            const ctx = document.getElementById('workChart').getContext('2d');
            statsChart = new Chart(ctx, {
                type: 'doughnut', data: { labels: ['例行', '臨時'], datasets: [{ data: [0, 0], backgroundColor: ['#60a5fa', '#f87171'], borderWidth: 0 }] },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } }, cutout: '70%' }
            });
            updateChart();
        };

        const updateChart = () => {
            if (!statsChart) return;
            let routine = 0, adhoc = 0;
            dailyLogs.forEach(l => (l.type === 'Routine' || l.type === 'Monthly') ? routine++ : adhoc++);
            statsChart.data.datasets[0].data = [routine, adhoc];
            statsChart.update();
            document.getElementById('stat-routine').textContent = routine;
            document.getElementById('stat-adhoc').textContent = adhoc;
            document.getElementById('log-count-badge').textContent = `${dailyLogs.length} ENTRIES`;
            document.getElementById('chart-placeholder').classList.toggle('hidden', routine > 0 || adhoc > 0);
        };

        const renderRoutineTasks = () => {
            const list = document.getElementById('routine-tasks-list');
            list.innerHTML = '';
            if (routineTasks.length === 0) {
                list.innerHTML = `<div class="text-center py-4 text-gray-500 text-sm bg-slate-700 rounded-lg">尚無任務</div>`;
                return;
            }

            const tasksByCategory = routineTasks.reduce((acc, task) => {
                const cat = task.category || '未分類';
                if (!acc[cat]) acc[cat] = [];
                acc[cat].push(task);
                return acc;
            }, {});

            Object.entries(tasksByCategory).forEach(([category, tasks], idx) => {
                let done = 0;
                tasks.forEach(t => (t.frequency === 'Monthly' ? monthlyTaskStatus[t.name] : completedRoutineTaskNames.has(t.name)) ? done++ : null);
                const percent = Math.round((done / tasks.length) * 100);
                const isOpened = openCategories.has(category);
                const cId = `c-${idx}`, iId = `i-${idx}`;

                const catDiv = document.createElement('div');
                catDiv.className = "relative mb-2";
                catDiv.innerHTML = `
                    <button onclick="toggleAccordion(this, '${category}', '${cId}', '${iId}')" class="relative flex items-center justify-between w-full p-3 text-base font-semibold rounded-lg border border-slate-700 overflow-hidden">
                        <div class="absolute inset-0 bg-cyan-600/30" style="width: ${percent}%;"></div>
                        <div class="relative z-20 flex items-center">
                            <span class="truncate">${category}</span>
                            <span onclick="editCategory(event, '${category}')" class="ml-2 p-1 hover:text-cyan-300 no-print" title="編輯類別名稱">
                                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            </span>
                        </div>
                        <div class="relative z-20 flex items-center space-x-2 text-sm">
                            <span>${percent}% (${done}/${tasks.length})</span>
                            <svg id="${iId}" class="w-4 h-4 transform ${isOpened ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </button>
                    <div id="${cId}" class="space-y-1 p-3 bg-slate-800 border border-t-0 border-slate-700 rounded-b-lg ${isOpened ? '' : 'hidden'}"></div>
                `;
                list.appendChild(catDiv);
                const taskContainer = catDiv.querySelector(`#${cId}`);

                tasks.forEach(task => {
                    const isM = task.frequency === 'Monthly';
                    const isDone = isM ? !!monthlyTaskStatus[task.name] : completedRoutineTaskNames.has(task.name);
                    const taskEl = document.createElement('div');
                    taskEl.className = `flex items-center justify-between p-2.5 rounded-lg border-2 ${isDone ? 'border-slate-800 opacity-60' : 'border-slate-700 bg-slate-700/30'}`;
                    taskEl.innerHTML = `
                        <div class="flex items-center space-x-3 flex-1 overflow-hidden">
                            <input type="checkbox" id="t-${task.name}" class="h-5 w-5 rounded bg-slate-900 border-slate-500 checked:bg-cyan-500" ${isDone ? 'checked disabled' : ''}>
                            <label for="t-${task.name}" class="truncate text-sm font-medium ${isDone ? 'line-through text-gray-500' : ''}">
                                ${task.name} <span class="text-[10px] px-1 rounded ${isM ? 'bg-emerald-700' : 'bg-blue-600'}">${isM ? '月' : '日'}</span>
                                <span class="text-xs text-gray-500 ml-1">${task.notes || ''}</span>
                            </label>
                        </div>
                        <div class="flex items-center space-x-1 no-print">
                            <button onclick="editRoutineTask('${task.name}')" class="p-1 text-gray-500 hover:text-cyan-400" title="編輯任務">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            </button>
                            ${!isDone ? `<button onclick="deleteRoutineTaskByName('${task.name}')" class="p-1 text-gray-500 hover:text-red-500"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg></button>` : ''}
                        </div>
                    `;
                    if (!isDone) {
                        taskEl.querySelector('input').onchange = async (e) => {
                            e.target.disabled = true;
                            if (isM) await updateMonthlyTaskStatus(task.name, true);
                            await window.addLogEntry(isM ? 'Monthly' : 'Routine', `完成: ${task.name}`, task.name, category);
                        };
                    }
                    taskContainer.appendChild(taskEl);
                });
            });
        };

        // --- Standard Logic & UI (Unchanged) ---
        window.toggleAccordion = (btn, cat, cId, iId) => {
            const content = document.getElementById(cId), icon = document.getElementById(iId);
            content.classList.toggle('hidden'); icon.classList.toggle('rotate-180');
            content.classList.contains('hidden') ? openCategories.delete(cat) : openCategories.add(cat);
        };
        const showMessage = (type, title, body, onConfirm = null) => {
            const m = document.getElementById('message-modal'), t = document.getElementById('message-modal-title'), b = document.getElementById('message-modal-body'), a = document.getElementById('message-modal-actions'), i = document.getElementById('modal-icon');
            t.textContent = title; b.textContent = body; a.innerHTML = '';
            const ok = document.createElement('button'); ok.className = "bg-cyan-500 text-slate-900 px-6 py-2 rounded-lg font-bold"; ok.textContent = "OK"; ok.onclick = () => m.classList.add('hidden');
            if (onConfirm) {
                const conf = document.createElement('button'); conf.className = "bg-red-600 text-white px-4 py-2 rounded-lg font-medium"; conf.textContent = "確認"; conf.onclick = () => { m.classList.add('hidden'); onConfirm(); };
                a.appendChild(ok); a.appendChild(conf); ok.textContent = "取消";
            } else a.appendChild(ok);
            m.classList.remove('hidden');
        };
        const initFirebase = async () => {
            document.getElementById('header-date').textContent = formatDisplayDate(getTodayDateString());
            document.getElementById('app-id-display').textContent = appId;
            try {
                app = initializeApp(firebaseConfig); db = getFirestore(app); auth = getAuth(app);
                await setPersistence(auth, browserSessionPersistence);
                if (initialAuthToken) await signInWithCustomToken(auth, initialAuthToken); else await signInAnonymously(auth);
                onAuthStateChanged(auth, user => {
                    if (user) {
                        authUserId = user.uid; dataUserId = localStorage.getItem('custom_user_id') || authUserId;
                        document.getElementById('user-id-display').textContent = dataUserId + (dataUserId !== authUserId ? " (Custom)" : "");
                        isAuthReady = true; initChart(); loadRoutineTasks(); loadMonthlyStatus(); subscribeToDailyLogs();
                        document.getElementById('loading-overlay').style.display = 'none'; document.getElementById('app-container').style.display = 'block';
                    }
                });
            } catch (e) { document.getElementById('loading-overlay').innerHTML = `失敗: ${e.message}`; }
        };
        const loadRoutineTasks = () => {
            if (unsubscribeRoutine) unsubscribeRoutine();
            unsubscribeRoutine = onSnapshot(getRoutineTasksDocRef(), snap => {
                routineTasks = snap.exists() ? snap.data().tasks : []; renderRoutineTasks();
            });
        };
        const loadMonthlyStatus = () => {
            if (unsubscribeMonthlyStatus) unsubscribeMonthlyStatus();
            unsubscribeMonthlyStatus = onSnapshot(getMonthlyStatusDocRef(), snap => {
                monthlyTaskStatus = snap.exists() ? snap.data() : {}; renderRoutineTasks();
            });
        };
        const subscribeToDailyLogs = () => {
            if (unsubscribeLogs) unsubscribeLogs();
            unsubscribeLogs = onSnapshot(getDailyLogCollectionRef(), snap => {
                dailyLogs = []; completedRoutineTaskNames.clear();
                snap.forEach(d => {
                    const data = d.data(); dailyLogs.push({ id: d.id, ...data });
                    if ((data.type === 'Routine' || data.type === 'Monthly') && data.taskName) completedRoutineTaskNames.add(data.taskName);
                });
                dailyLogs.sort((a,b) => b.timestamp - a.timestamp); renderTimeline(dailyLogs, document.getElementById('daily-log-timeline')); updateChart();
            });
        };
        const saveRoutineTasks = async (tasks) => await setDoc(getRoutineTasksDocRef(), { tasks });
        const updateMonthlyTaskStatus = async (name, done) => {
            const s = { ...monthlyTaskStatus }; done ? s[name] = Date.now() : delete s[name];
            await setDoc(getMonthlyStatusDocRef(), s);
        };
        window.addRoutineTask = async () => {
            const f = document.getElementById('new-routine-task-frequency').value, c = document.getElementById('new-routine-task-category').value.trim() || '未分類', n = document.getElementById('new-routine-task-name').value.trim(), no = document.getElementById('new-routine-task-notes').value.trim();
            if (!n) return alert("名稱必填"); if (routineTasks.some(t => t.name === n)) return alert("重複了");
            await saveRoutineTasks([...routineTasks, { name: n, category: c, notes: no, frequency: f }]);
            document.getElementById('new-routine-task-name').value = '';
        };
        window.deleteRoutineTaskByName = (name) => {
            if (confirm(`確定刪除「${name}」？`)) saveRoutineTasks(routineTasks.filter(t => t.name !== name));
        };
        window.addLogEntry = async (type, description, taskName = null, category = '一般') => {
            await addDoc(getDailyLogCollectionRef(), { type, description, taskName, category, timestamp: Date.now(), timeString: new Date().toLocaleTimeString('zh-TW') });
            return true;
        };
        window.logAdHocTask = async () => {
            const d = document.getElementById('adhoc-task-description'), c = document.getElementById('adhoc-category');
            if (d.value.trim() && await window.addLogEntry('AdHoc', d.value.trim(), null, c.value)) d.value = '';
        };
        const renderTimeline = (logs, container, isH = false, dStr = getTodayDateString()) => {
            container.innerHTML = '';
            if (logs.length === 0) { container.innerHTML = `<p class="text-center py-10 text-gray-600">查無紀錄</p>`; return; }
            logs.forEach(l => {
                const isR = l.type === 'Routine' || l.type === 'Monthly', isM = l.type === 'Monthly';
                const item = document.createElement('div'); item.className = 'timeline-item';
                item.innerHTML = `
                    <div class="timeline-dot ${isM ? 'bg-emerald-500' : isR ? 'bg-blue-500' : 'bg-red-500'}"></div>
                    <div class="card p-4">
                        <div class="flex justify-between items-start">
                            <div class="flex-1">
                                <p class="text-sm font-bold text-gray-100">${l.description}</p>
                                <p class="text-xs text-gray-500">[${l.type}] ${l.category}</p>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="text-xs font-mono text-cyan-400">${l.timeString}</span>
                                <button onclick="deleteLog('${l.id}', '${dStr}')" class="text-gray-600 hover:text-red-500 no-print">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                </button>
                            </div>
                        </div>
                    </div>`;
                container.appendChild(item);
            });
        };
        window.deleteLog = async (id, dStr) => { if (confirm("確定刪除？")) await deleteDoc(doc(getDailyLogCollectionRef(dStr), id)); };
        window.showUserSettingsModal = () => {
            document.getElementById('modal-current-user-id').textContent = dataUserId;
            document.getElementById('custom-user-id-input').value = localStorage.getItem('custom_user_id') || '';
            document.getElementById('user-settings-modal').classList.remove('hidden');
        };
        window.closeUserSettingsModal = () => document.getElementById('user-settings-modal').classList.add('hidden');
        window.applyCustomUserId = () => {
            const id = document.getElementById('custom-user-id-input').value.trim();
            if (id) { localStorage.setItem('custom_user_id', id); window.location.reload(); }
        };
        window.resetToSystemId = () => { localStorage.removeItem('custom_user_id'); window.location.reload(); };
        window.showHistoryModal = () => { document.getElementById('history-modal').classList.remove('hidden'); window.fetchLogsForDate(getTodayDateString()); };
        window.closeHistoryModal = () => document.getElementById('history-modal').classList.add('hidden');
        window.fetchLogsForDate = async (d) => {
            const snap = await getDocs(getDailyLogCollectionRef(d));
            const h = []; snap.forEach(doc => h.push({ id: doc.id, ...doc.data() }));
            h.sort((a,b) => b.timestamp - a.timestamp); renderTimeline(h, document.getElementById('history-log-entries'), true, d);
        };
        window.resetMonthlyStatus = () => { if (confirm("確定重置所有每月任務？")) setDoc(getMonthlyStatusDocRef(), {}); };
        window.exportRoutineTasks = () => {
            const blob = new Blob([JSON.stringify(routineTasks, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'tasks.json'; a.click();
        };
        window.importRoutineTasks = () => {
            const input = document.createElement('input'); input.type = 'file'; input.onchange = (e) => {
                const reader = new FileReader(); reader.onload = (ev) => { saveRoutineTasks(JSON.parse(ev.target.result)); }; reader.readAsText(e.target.files[0]);
            }; input.click();
        };
        window.togglePrintView = () => {
            const content = document.getElementById('print-content');
            const tasks = document.getElementById('routine-tasks-list').cloneNode(true);
            const logs = document.getElementById('daily-log-timeline').cloneNode(true);
            tasks.querySelectorAll('.no-print, button, input').forEach(el => el.remove());
            logs.querySelectorAll('.no-print, button').forEach(el => el.remove());
            content.innerHTML = `<h1 class="text-2xl font-bold mb-4">工作日誌報告 - ${getTodayDateString()}</h1>`;
            content.appendChild(tasks); content.appendChild(logs);
            document.getElementById('print-modal').classList.remove('hidden');
        };

        window.onload = initFirebase;
    </script>
</body>
</html>
