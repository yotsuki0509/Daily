<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日工作日誌 - 戰情室 (已修復版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Microsoft YaHei', 'Microsoft JhengHei', 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }
        .card:hover { border-color: #06b6d4; }
        .loading-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a; display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); display: flex; justify-content: center; align-items: center; z-index: 100;
        }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body>
    <div id="loading-overlay" class="loading-overlay">
        <div class="text-center">
            <svg class="animate-spin h-10 w-10 text-cyan-400 mb-4 mx-auto" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p>正在連線至資料庫...</p>
        </div>
    </div>

    <div class="container mx-auto p-4 max-w-7xl" id="app-container" style="display: none;">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 bg-slate-800 p-6 rounded-xl card border-cyan-400 border-l-4">
            <div>
                <h1 class="text-2xl font-bold text-cyan-400">工作日誌   - Crafted by 勝全   Powered by AI</h1>
                <p class="text-sm text-gray-400" id="header-date"></p>
            </div>
            <div class="flex space-x-2 no-print">
                <button onclick="showHistoryModal()" class="bg-indigo-600 px-4 py-2 rounded-lg text-sm">歷史紀錄</button>
                <button onclick="showUserSettingsModal()" class="bg-cyan-600 px-4 py-2 rounded-lg text-sm">帳號切換</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-4 space-y-6">
                <div class="card p-6">
                    <h2 class="text-cyan-400 font-bold mb-4">工作比例分析</h2>
                    <div class="h-48 relative">
                        <canvas id="workChart"></canvas>
                        <div id="chart-placeholder" class="absolute inset-0 flex items-center justify-center text-gray-500 text-sm hidden">尚無資料</div>
                    </div>
                </div>
                <div class="card p-6 no-print">
                    <h2 class="text-red-400 font-bold mb-3">臨時事項紀錄</h2>
                    <input type="text" id="adhoc-task-description" placeholder="發生了什麼事？" class="w-full p-2 bg-slate-900 border border-slate-700 rounded mb-3 text-sm">
                    <button onclick="logAdHocTask()" class="w-full bg-red-500 py-2 rounded font-bold text-sm">送出紀錄</button>
                </div>
            </div>

            <div class="lg:col-span-8 space-y-6">
                <div class="card p-6">
                    <h2 class="text-cyan-400 font-bold mb-4">每日例行任務</h2>
                    <div id="routine-tasks-list" class="space-y-2"></div>
                </div>
                <div class="card p-6 min-h-[400px]">
                    <h2 class="text-indigo-400 font-bold mb-4">今日工作時間軸</h2>
                    <div id="daily-log-timeline" class="space-y-4"></div>
                </div>
            </div>
        </div>

        <footer class="mt-8 text-center text-xs text-gray-600">
            App ID: <span id="app-id-display" class="font-mono text-cyan-500"></span> | 
            User ID: <span id="user-id-display" class="font-mono text-cyan-500"></span>
        </footer>
    </div>

    <div id="user-settings-modal" class="modal-overlay hidden">
        <div class="bg-slate-800 p-6 rounded-xl w-full max-w-md border border-slate-600">
            <h3 class="text-xl font-bold text-cyan-400 mb-4">帳號切換</h3>
            <div class="space-y-4">
                <div class="bg-slate-900 p-3 rounded">
                    <p class="text-xs text-gray-500">目前 ID</p>
                    <p id="modal-current-user-id" class="font-mono text-green-400 font-bold"></p>
                </div>
                <input type="text" id="custom-user-id-input" placeholder="輸入您的自訂名稱" class="w-full p-3 bg-slate-900 border border-indigo-500 rounded text-white">
                <div class="flex space-x-2">
                    <button onclick="applyCustomUserId()" class="flex-1 bg-indigo-600 py-2 rounded font-bold">確認切換</button>
                    <button onclick="closeUserSettingsModal()" class="px-4 py-2 bg-slate-700 rounded">取消</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- 核心變數與鎖定 ---
        const appId = "default-app-id"; // 您要求的關鍵鎖定 
        const firebaseConfig = {
            apiKey: "AIzaSyAXnSDK_kY4Aa8XvL0M_Md9kA4Wdow_Uvs",
            authDomain: "daily-23c82.firebaseapp.com",
            projectId: "daily-23c82",
            storageBucket: "daily-23c82.firebasestorage.app",
            messagingSenderId: "574719251457",
            appId: "1:574719251457:web:30aadb364406783b175c00",
            measurementId: "G-6JN0N6BJHH"
        }; [cite: 35]

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        let dataUserId = localStorage.getItem('custom_user_id'); [cite: 75]
        let dailyLogs = [];

        // --- 資料庫路徑定義 (已整合 appId) ---
        const getDailyLogCollectionRef = () => {
            const today = new Date().toISOString().split('T')[0];
            return collection(db, 'artifacts', appId, 'users', dataUserId, 'daily_logs', today, 'entries');
        }; [cite: 73, 74]

        const getRoutineTasksDocRef = () => doc(db, 'artifacts', appId, 'users', dataUserId, 'config', 'routine_tasks'); [cite: 70, 71]

        // --- 初始化系統 ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                if (!dataUserId) dataUserId = user.uid; [cite: 38]
                document.getElementById('loading-overlay').style.display = 'none';
                document.getElementById('app-container').style.display = 'block';
                document.getElementById('app-id-display').textContent = appId;
                document.getElementById('user-id-display').textContent = dataUserId;
                initApp();
            } else {
                signInAnonymously(auth); [cite: 31]
            }
        });

        window.applyCustomUserId = () => {
            const input = document.getElementById('custom-user-id-input').value.trim();
            if (input) {
                localStorage.setItem('custom_user_id', input); [cite: 78]
                location.reload();
            }
        };

        window.showUserSettingsModal = () => {
            document.getElementById('modal-current-user-id').textContent = dataUserId;
            document.getElementById('user-settings-modal').classList.remove('hidden');
        };

        window.closeUserSettingsModal = () => {
            document.getElementById('user-settings-modal').classList.add('hidden');
        };

        // 簡單的時間軸載入邏輯
        function initApp() {
            const today = new Date();
            document.getElementById('header-date').textContent = today.toLocaleDateString();

            // 監聽今日日誌 [cite: 41, 74]
            onSnapshot(getDailyLogCollectionRef(), (snapshot) => {
                const timeline = document.getElementById('daily-log-timeline');
                timeline.innerHTML = '';
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const item = document.createElement('div');
                    item.className = "p-3 bg-slate-700/50 rounded border-l-2 border-indigo-400";
                    item.innerHTML = `<span class="text-xs text-gray-400 font-mono">${data.time || ''}</span><p class="text-sm">${data.task}</p>`;
                    timeline.appendChild(item);
                });
            });
        }

        window.logAdHocTask = async () => {
            const input = document.getElementById('adhoc-task-description');
            if (!input.value) return;
            
            await addDoc(getDailyLogCollectionRef(), {
                task: input.value,
                type: 'Ad-hoc',
                time: new Date().toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' }),
                timestamp: serverTimestamp()
            }); [cite: 32]
            input.value = '';
        };

    </script>
</body>
</html>
