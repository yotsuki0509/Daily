<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>戰情室工作日誌 - 任務整合版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Microsoft YaHei', 'Microsoft JhengHei', 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }
        .card {
            background-color: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            transition: all 0.3s ease;
        }
        .card:hover {
            border-color: #06b6d4;
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.2);
        }
        .timeline-item {
            position: relative;
            padding-left: 2.5rem;
            padding-bottom: 1.5rem;
            border-left: 2px solid #334155;
        }
        .timeline-item:last-child { border-left: 2px solid transparent; }
        .timeline-dot {
            position: absolute;
            left: -10px;
            top: 0;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #0f172a;
            border: 2px solid #334155;
            box-shadow: 0 0 0 3px #1e293b;
        }
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f172a;
            display: flex; justify-content: center; align-items: center;
            z-index: 1000;
        }
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
        }
        .modal-content {
            background-color: #1e293b;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        @media print { .no-print { display: none !important; } }
    </style>
</head>
<body class="text-gray-100">

    <div id="loading-overlay" class="loading-overlay">
        <div class="text-center">
            <svg class="animate-spin mx-auto h-10 w-10 text-cyan-400 mb-4" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
            <p class="text-gray-400">系統初始化中...</p>
        </div>
    </div>

    <div class="container mx-auto p-4 max-w-7xl" id="app-container" style="display: none;">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 bg-slate-800 p-6 rounded-xl card border-cyan-400 border-l-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-widest text-cyan-400">工作日誌  - Crafted by 勝全 · Powered by AI</h1>
                <p class="text-gray-400 mt-1 flex items-center text-sm">
                    <span id="header-date" class="font-mono"></span>
                    <span class="mx-2">|</span>
                    <span id="user-id-display" class="text-indigo-400">載入中...</span>
                </p>
            </div>
            <div class="mt-4 md:mt-0 flex space-x-2 no-print">
                <button onclick="togglePrintView()" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-lg text-sm transition">預覽/列印</button>
                <button onclick="showHistoryModal()" class="bg-indigo-600 hover:bg-indigo-500 px-4 py-2 rounded-lg text-sm transition">歷史紀錄</button>
                <button onclick="showUserSettingsModal()" class="bg-cyan-600 hover:bg-cyan-500 px-4 py-2 rounded-lg text-sm transition font-bold">帳號設定</button>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- 左側：分析與快速記錄 -->
            <div class="lg:col-span-4 space-y-6">
                <div class="card p-6">
                    <h2 class="text-lg font-bold text-cyan-400 mb-4 border-b border-slate-700 pb-2 flex justify-between">
                        <span>[ANALYSIS] 任務比例</span>
                        <span id="log-count-badge" class="text-xs text-slate-500">0 ENTRIES</span>
                    </h2>
                    <div class="relative h-48">
                        <canvas id="workChart"></canvas>
                        <div id="chart-placeholder" class="absolute inset-0 flex items-center justify-center bg-slate-800/80 text-gray-500 text-sm hidden">尚無今日資料</div>
                    </div>
                </div>

                <div class="card p-6 no-print">
                    <h2 class="text-lg font-bold text-red-400 mb-3 border-b border-slate-700 pb-2">[CAPTURE] 臨時事項</h2>
                    <div class="space-y-3">
                        <select id="adhoc-category" class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm">
                            <option value="一般">📌 一般事項</option>
                            <option value="會議">🗣️ 會議溝通</option>
                            <option value="維修">🔧 維修/除錯</option>
                            <option value="開發">💻 專案開發</option>
                        </select>
                        <input type="text" id="adhoc-task-description" placeholder="輸入事項描述..." class="w-full p-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm">
                        <button onclick="logAdHocTask()" class="w-full bg-red-600 hover:bg-red-500 py-2 rounded-lg font-bold transition">記錄日誌 (Ad-hoc)</button>
                    </div>
                </div>
            </div>

            <!-- 右側：任務中心與時間軸 -->
            <div class="lg:col-span-8 space-y-6">
                
                <!-- 整合任務中心 (Daily + Monthly) -->
                <div class="card p-6 no-print">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                        <h2 class="text-xl font-bold text-cyan-400">[MISSION CENTER] 任務中心</h2>
                        <button onclick="resetMonthlyStatus()" class="text-xs bg-red-900/30 text-red-400 hover:bg-red-900/50 px-3 py-1 rounded transition">重置每月任務</button>
                    </div>

                    <!-- 任務分類收合列表 -->
                    <div id="task-accordion" class="space-y-3 mb-6">
                        <div class="text-center py-10 text-gray-500">尚無任務，請由下方新增</div>
                    </div>

                    <!-- 新增任務表單 -->
                    <div class="border-t border-slate-700 pt-4">
                        <button onclick="document.getElementById('add-task-form').classList.toggle('hidden')" class="w-full py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-sm font-medium transition">+ 新增任務項目</button>
                        <div id="add-task-form" class="hidden mt-3 p-4 bg-slate-900/50 border border-slate-700 rounded-lg space-y-2">
                            <div class="grid grid-cols-2 gap-2">
                                <select id="new-task-freq" class="p-2 bg-slate-800 border border-slate-700 rounded text-sm text-cyan-400">
                                    <option value="daily">📅 每日任務 (Daily)</option>
                                    <option value="monthly">🌙 每月任務 (Monthly)</option>
                                </select>
                                <input type="text" id="new-task-category" placeholder="任務類別 (如: ERP)" class="p-2 bg-slate-800 border border-slate-700 rounded text-sm">
                            </div>
                            <input type="text" id="new-task-name" placeholder="任務名稱" class="w-full p-2 bg-slate-800 border border-slate-700 rounded text-sm">
                            <input type="text" id="new-task-notes" placeholder="備註 (選填)" class="w-full p-2 bg-slate-800 border border-slate-700 rounded text-sm">
                            <button onclick="addTask()" class="w-full bg-cyan-600 hover:bg-cyan-500 py-2 rounded font-bold transition">儲存至任務清單</button>
                        </div>
                    </div>
                </div>

                <!-- 時間軸 -->
                <div class="card p-6 min-h-[400px]">
                    <h2 class="text-xl font-bold text-indigo-400 mb-6 border-b border-slate-700 pb-2">[DAILY LOG] 工作日誌軸</h2>
                    <div id="daily-log-timeline"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modals (History, User Settings, Message) -->
    <div id="user-settings-modal" class="modal-overlay hidden">
        <div class="modal-content p-6 rounded-xl w-full max-w-md">
            <h3 class="text-xl font-bold text-cyan-400 mb-4">帳號設定</h3>
            <div class="space-y-4">
                <div class="bg-slate-900 p-3 rounded border border-slate-700">
                    <p class="text-xs text-gray-500 uppercase">當前 ID</p>
                    <p id="modal-current-user-id" class="font-mono text-green-400 break-all"></p>
                </div>
                <div>
                    <label class="block text-sm mb-1">切換自訂 ID</label>
                    <div class="flex space-x-2">
                        <input type="text" id="custom-user-id-input" class="flex-1 p-2 bg-slate-900 border border-slate-700 rounded">
                        <button onclick="applyCustomUserId()" class="bg-indigo-600 px-4 py-2 rounded">套用</button>
                    </div>
                </div>
                <button onclick="closeUserSettingsModal()" class="w-full py-2 bg-slate-700 rounded">關閉</button>
            </div>
        </div>
    </div>

    <div id="history-modal" class="modal-overlay hidden">
        <div class="modal-content p-0 rounded-xl w-full max-w-4xl flex flex-col max-h-[85vh]">
            <div class="bg-indigo-600 p-4 flex justify-between items-center text-white">
                <h2 class="font-bold">歷史紀錄查詢</h2>
                <button onclick="closeHistoryModal()" class="text-2xl">&times;</button>
            </div>
            <div class="p-4 bg-slate-700 flex items-center space-x-4">
                <input type="date" id="history-date-picker" onchange="fetchLogsForDate(this.value)" class="p-2 bg-slate-900 border border-slate-600 rounded">
            </div>
            <div id="history-log-entries" class="p-6 overflow-y-auto flex-1"></div>
        </div>
    </div>

    <div id="message-modal" class="modal-overlay hidden">
        <div class="modal-content p-6 rounded-xl text-center w-80">
            <h3 id="msg-title" class="text-xl font-bold mb-2"></h3>
            <p id="msg-body" class="text-gray-400 mb-6"></p>
            <div id="msg-actions" class="flex justify-center space-x-2"></div>
        </div>
    </div>

    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // --- Config & State ---
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'war-room-v2';
        const firebaseConfig = JSON.parse(__firebase_config);
        
        let db, auth, dataUserId;
        let allTasks = []; // { name, category, freq: 'daily'|'monthly', notes }
        let completedToday = new Set(); 
        let monthlyStatus = {}; // { taskName: timestamp }
        let dailyLogs = [];
        let openCategories = new Set();
        let workChart = null;

        // --- Helpers ---
        const getTodayStr = () => new Date().toISOString().split('T')[0];
        const getTasksRef = () => doc(db, 'artifacts', appId, 'users', dataUserId, 'config', 'tasks_v2');
        const getMonthlyStatusRef = () => doc(db, 'artifacts', appId, 'users', dataUserId, 'config', 'monthly_status');
        const getLogsRef = (date = getTodayStr()) => collection(db, 'artifacts', appId, 'users', dataUserId, 'daily_logs', date, 'entries');

        const showMsg = (title, body, confirmFn = null) => {
            document.getElementById('msg-title').textContent = title;
            document.getElementById('msg-body').textContent = body;
            const actions = document.getElementById('msg-actions');
            actions.innerHTML = '';
            if (confirmFn) {
                const btnC = document.createElement('button');
                btnC.className = "bg-red-600 px-4 py-2 rounded"; btnC.textContent = "確認";
                btnC.onclick = () => { document.getElementById('message-modal').classList.add('hidden'); confirmFn(); };
                const btnX = document.createElement('button');
                btnX.className = "bg-slate-700 px-4 py-2 rounded"; btnX.textContent = "取消";
                btnX.onclick = () => document.getElementById('message-modal').classList.add('hidden');
                actions.append(btnX, btnC);
            } else {
                const btnOk = document.createElement('button');
                btnOk.className = "bg-cyan-600 px-6 py-2 rounded"; btnOk.textContent = "OK";
                btnOk.onclick = () => document.getElementById('message-modal').classList.add('hidden');
                actions.appendChild(btnOk);
            }
            document.getElementById('message-modal').classList.remove('hidden');
        };

        // --- Firebase Init ---
        const init = async () => {
            try {
                const app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                
                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        dataUserId = localStorage.getItem('custom_user_id') || user.uid;
                        document.getElementById('user-id-display').textContent = `ID: ${dataUserId}`;
                        document.getElementById('header-date').textContent = getTodayStr().replace(/-/g, '/');
                        initChart();
                        subscribeTasks();
                        subscribeLogs();
                        document.getElementById('loading-overlay').style.display = 'none';
                        document.getElementById('app-container').style.display = 'block';
                    }
                });
                await signInAnonymously(auth);
            } catch (e) { console.error(e); }
        };

        // --- Subscriptions ---
        const subscribeTasks = () => {
            onSnapshot(getTasksRef(), (s) => {
                allTasks = s.exists() ? s.data().tasks : [];
                renderTasks();
            });
            onSnapshot(getMonthlyStatusRef(), (s) => {
                monthlyStatus = s.exists() ? s.data() : {};
                renderTasks();
            });
        };

        const subscribeLogs = () => {
            onSnapshot(getLogsRef(), (s) => {
                dailyLogs = [];
                completedToday.clear();
                s.forEach(d => {
                    const data = d.data();
                    dailyLogs.push({ id: d.id, ...data });
                    if (data.taskName) completedToday.add(data.taskName);
                });
                dailyLogs.sort((a,b) => b.timestamp - a.timestamp);
                renderTasks();
                renderTimeline(dailyLogs, document.getElementById('daily-log-timeline'));
                updateChart();
            });
        };

        // --- Actions ---
        window.addTask = async () => {
            const freq = document.getElementById('new-task-freq').value;
            const category = document.getElementById('new-task-category').value.trim() || '未分類';
            const name = document.getElementById('new-task-name').value.trim();
            const notes = document.getElementById('new-task-notes').value.trim();
            
            if (!name) return showMsg("錯誤", "任務名稱不能為空");
            if (allTasks.some(t => t.name === name)) return showMsg("重複", "任務名稱已存在");

            const updated = [...allTasks, { freq, category, name, notes }];
            await setDoc(getTasksRef(), { tasks: updated });
            document.getElementById('new-task-name').value = '';
            document.getElementById('new-task-notes').value = '';
        };

        window.toggleTask = async (name, freq, category) => {
            const isMonthly = freq === 'monthly';
            const logType = isMonthly ? 'Monthly' : 'Routine';
            const desc = `[${isMonthly ? '每月' : '每日'}] 完成: ${name}`;

            try {
                // 1. 寫入日誌
                await addDoc(getLogsRef(), {
                    type: logType, taskName: name, description: desc, category,
                    timestamp: Date.now(),
                    timeString: new Date().toLocaleTimeString('zh-TW', { hour12: false })
                });

                // 2. 如果是每月任務，更新永久狀態
                if (isMonthly) {
                    const newStatus = { ...monthlyStatus, [name]: Date.now() };
                    await setDoc(getMonthlyStatusRef(), newStatus);
                }
            } catch (e) { showMsg("錯誤", e.message); }
        };

        window.deleteTaskItem = (name) => {
            showMsg("確認刪除", `確定要移除任務「${name}」嗎？`, async () => {
                const updated = allTasks.filter(t => t.name !== name);
                await setDoc(getTasksRef(), { tasks: updated });
            });
        };

        window.resetMonthlyStatus = () => {
            showMsg("重置每月任務", "確定要將所有每月任務重置為「未完成」嗎？", async () => {
                await setDoc(getMonthlyStatusRef(), {});
            });
        };

        // --- Rendering ---
        const renderTasks = () => {
            const container = document.getElementById('task-accordion');
            container.innerHTML = '';
            
            if (allTasks.length === 0) {
                container.innerHTML = `<div class="text-center py-10 text-gray-500">尚無任務項目</div>`;
                return;
            }

            const grouped = allTasks.reduce((acc, t) => {
                if (!acc[t.category]) acc[t.category] = [];
                acc[t.category].push(t);
                return acc;
            }, {});

            Object.entries(grouped).forEach(([cat, tasks], idx) => {
                const doneCount = tasks.filter(t => (t.freq === 'daily' ? completedToday.has(t.name) : !!monthlyStatus[t.name])).length;
                const percent = Math.round((doneCount / tasks.length) * 100);
                const isOpened = openCategories.has(cat);
                const contentId = `content-${idx}`;

                const catDiv = document.createElement('div');
                catDiv.className = "border border-slate-700 rounded-lg overflow-hidden mb-2";
                catDiv.innerHTML = `
                    <button class="w-full flex items-center justify-between p-3 bg-slate-800 hover:bg-slate-750 transition relative overflow-hidden" onclick="window.toggleCat('${cat}')">
                        <div class="absolute inset-0 bg-cyan-500/10 pointer-events-none transition-all" style="width: ${percent}%"></div>
                        <span class="relative font-bold text-gray-200">${cat}</span>
                        <div class="relative flex items-center space-x-2">
                            <span class="text-xs font-mono ${percent === 100 ? 'text-green-400' : 'text-cyan-400'}">${percent}% (${doneCount}/${tasks.length})</span>
                            <svg class="w-4 h-4 transform transition ${isOpened ? 'rotate-180' : ''}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7" stroke-width="2"/></svg>
                        </div>
                    </button>
                    <div id="${contentId}" class="p-2 space-y-1 bg-slate-800/50 ${isOpened ? '' : 'hidden'}"></div>
                `;
                container.appendChild(catDiv);
                
                const taskList = catDiv.querySelector(`#${contentId}`);
                tasks.forEach(t => {
                    const isMonthly = t.freq === 'monthly';
                    const isDone = isMonthly ? !!monthlyStatus[t.name] : completedToday.has(t.name);
                    
                    let dateLabel = '';
                    if (isMonthly && isDone) {
                        const d = new Date(monthlyStatus[t.name]);
                        dateLabel = ` (${d.getMonth()+1}/${d.getDate()})`;
                    }

                    const tDiv = document.createElement('div');
                    // 顏色區分：每月任務使用 Emerald (綠)，每日任務使用 Cyan (藍)
                    const baseColor = isMonthly ? 'emerald' : 'cyan';
                    const activeBorder = isDone ? `border-${baseColor}-600/50 bg-${baseColor}-900/10 opacity-60` : `border-slate-700 hover:border-${baseColor}-500 bg-slate-900/40`;

                    tDiv.className = `flex items-center justify-between p-3 border-2 rounded-lg transition ${activeBorder}`;
                    tDiv.innerHTML = `
                        <div class="flex items-center space-x-3 truncate">
                            <input type="checkbox" ${isDone ? 'checked disabled' : ''} onchange="window.toggleTask('${t.name}', '${t.freq}', '${t.category}')" 
                                class="h-5 w-5 rounded border-gray-600 bg-gray-800 text-${baseColor}-500 focus:ring-${baseColor}-500 cursor-pointer">
                            <div class="truncate">
                                <span class="text-xs uppercase font-bold px-1.5 py-0.5 rounded mr-2 ${isMonthly ? 'bg-emerald-900 text-emerald-300' : 'bg-cyan-900 text-cyan-300'}">${isMonthly ? 'Monthly' : 'Daily'}</span>
                                <span class="${isDone ? 'line-through text-gray-500' : 'text-gray-100'} font-medium">${t.name}</span>
                                <span class="text-emerald-400 font-bold text-xs">${dateLabel}</span>
                                ${t.notes ? `<p class="text-[10px] text-gray-500 truncate">${t.notes}</p>` : ''}
                            </div>
                        </div>
                        ${!isDone ? `<button onclick="window.deleteTaskItem('${t.name}')" class="text-slate-600 hover:text-red-500 px-2">&times;</button>` : ''}
                    `;
                    taskList.appendChild(tDiv);
                });
            });
        };

        window.toggleCat = (cat) => {
            if (openCategories.has(cat)) openCategories.delete(cat);
            else openCategories.add(cat);
            renderTasks();
        };

        const renderTimeline = (logs, container) => {
            container.innerHTML = '';
            if (logs.length === 0) {
                container.innerHTML = `<div class="py-20 text-center text-slate-600">今日尚無日誌紀錄</div>`;
                return;
            }
            logs.forEach(log => {
                const color = log.type === 'Monthly' ? 'emerald' : (log.type === 'Routine' ? 'blue' : 'red');
                const item = document.createElement('div');
                item.className = 'timeline-item';
                item.innerHTML = `
                    <div class="timeline-dot border-${color}-600 bg-${color}-500"></div>
                    <div class="card p-3 flex justify-between items-center shadow-sm">
                        <div>
                            <p class="text-sm font-bold text-gray-200">${log.description}</p>
                            <p class="text-[10px] text-gray-500 uppercase tracking-tighter">${log.type} | ${log.category}</p>
                        </div>
                        <div class="flex items-center space-x-3">
                            <span class="text-xs font-mono text-cyan-400">${log.timeString}</span>
                            <button onclick="window.deleteLog('${log.id}')" class="text-slate-600 hover:text-red-400">&times;</button>
                        </div>
                    </div>
                `;
                container.appendChild(item);
            });
        };

        window.deleteLog = (id) => {
            showMsg("刪除紀錄", "確定要刪除這筆日誌嗎？若是任務紀錄，該任務將會變回未完成。", async () => {
                await deleteDoc(doc(getLogsRef(), id));
            });
        };

        // --- Chart & Stats ---
        const initChart = () => {
            const ctx = document.getElementById('workChart').getContext('2d');
            workChart = new Chart(ctx, {
                type: 'doughnut',
                data: { labels: ['例行/每月', '臨時事項'], datasets: [{ data: [0, 0], backgroundColor: ['#06b6d4', '#ef4444'], borderWidth: 0 }] },
                options: { cutout: '80%', plugins: { legend: { display: false } } }
            });
        };
        const updateChart = () => {
            const routines = dailyLogs.filter(l => l.type !== 'AdHoc').length;
            const adhoc = dailyLogs.filter(l => l.type === 'AdHoc').length;
            workChart.data.datasets[0].data = [routines, adhoc];
            workChart.update();
            document.getElementById('log-count-badge').textContent = `${dailyLogs.length} ENTRIES`;
            document.getElementById('chart-placeholder').classList.toggle('hidden', dailyLogs.length > 0);
        };

        // --- AdHoc ---
        window.logAdHocTask = async () => {
            const desc = document.getElementById('adhoc-task-description').value.trim();
            const cat = document.getElementById('adhoc-category').value;
            if (!desc) return;
            await addDoc(getLogsRef(), {
                type: 'AdHoc', description: desc, category: cat,
                timestamp: Date.now(), timeString: new Date().toLocaleTimeString('zh-TW', { hour12: false })
            });
            document.getElementById('adhoc-task-description').value = '';
        };

        // --- User Mgt ---
        window.applyCustomUserId = () => {
            const id = document.getElementById('custom-user-id-input').value.trim();
            if (id) {
                localStorage.setItem('custom_user_id', id);
                window.location.reload();
            }
        };
        window.showUserSettingsModal = () => {
            document.getElementById('modal-current-user-id').textContent = dataUserId;
            document.getElementById('user-settings-modal').classList.remove('hidden');
        };
        window.closeUserSettingsModal = () => document.getElementById('user-settings-modal').classList.add('hidden');

        // --- History ---
        window.showHistoryModal = () => {
            document.getElementById('history-modal').classList.remove('hidden');
            document.getElementById('history-date-picker').value = getTodayStr();
            fetchLogsForDate(getTodayStr());
        };
        window.closeHistoryModal = () => document.getElementById('history-modal').classList.add('hidden');
        window.fetchLogsForDate = async (date) => {
            const s = await getDocs(getLogsRef(date));
            const logs = [];
            s.forEach(d => logs.push({ id: d.id, ...d.data() }));
            logs.sort((a,b) => b.timestamp - a.timestamp);
            renderTimeline(logs, document.getElementById('history-log-entries'));
        };

        init();
    </script>
</body>
</html>
