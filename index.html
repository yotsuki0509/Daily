<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日工作日誌 - 戰情室</title>
    <!-- 載入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 載入 Chart.js 用於圖表呈現 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- 調整字體為 Microsoft Yahei/JhengHei -->
    <style>
        body {
            /* 變更為 Microsoft YaHei (Windows) 和 Microsoft JhengHei (Mac) */
            font-family: 'Microsoft YaHei', 'Microsoft JhengHei', 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #e2e8f0; /* Gray 200 */
        }
        .card {
            background-color: #1e293b; /* Slate 800 */
            border: 1px solid #334155; /* Slate 700 */
            border-radius: 0.75rem; /* rounded-xl */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }
        .card:hover {
            border-color: #06b6d4; /* Cyan 500 */
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); /* Cyan glow */
        }
        /* 時間軸樣式 */
        .timeline-item {
            position: relative;
            padding-left: 2.5rem;
            padding-bottom: 1.5rem;
            border-left: 2px solid #334155; /* Slate 700 */
        }
        .timeline-item:last-child {
            border-left: 2px solid transparent;
        }
        .timeline-dot {
            position: absolute;
            left: -10px;
            top: 0;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background-color: #0f172a; /* Match body bg */
            border: 2px solid #334155; /* Slate 700 */
            box-shadow: 0 0 0 3px #1e293b; /* Slate 800 */
        }
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.3s ease;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background-color: #1e293b;
            color: #e2e8f0;
            max-width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }
        /* 避免在簡報模式下顯示刪除按鈕 */
        @media print {
            .no-print {
                display: none !important;
            }
        }
    </style>
</head>
<body class="text-gray-100">
    <!-- 載入中畫面 -->
    <div id="loading-overlay" class="loading-overlay">
        <div class="text-center">
            <svg class="animate-spin mx-auto h-10 w-10 text-cyan-400 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-gray-400 font-medium">個人戰情室系統載入中...</p>
        </div>
    </div>

    <!-- 應用程式容器 -->
    <div class="container mx-auto p-4 max-w-7xl" id="app-container" style="display: none;">
        
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 bg-slate-800 p-6 rounded-xl card border-cyan-400 border-l-4 border-t-0 border-r-0 border-b-0">
            <div>
                <h1 class="text-3xl font-extrabold tracking-widest text-cyan-400">COMMAND CENTER // 工作日誌</h1>
                <p class="text-gray-400 mt-1 flex items-center text-sm">
                    <svg class="w-4 h-4 mr-1 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    <span id="header-date" class="font-mono"></span>
                </p>
            </div>
            <div class="mt-4 md:mt-0 flex space-x-3 no-print">
                 <button onclick="togglePrintView()" class="flex items-center space-x-2 bg-slate-700 hover:bg-slate-600 text-gray-200 font-medium py-2 px-4 rounded-lg transition duration-150 text-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                    <span>預覽/列印</span>
                </button>
                <button onclick="showHistoryModal()" class="flex items-center space-x-2 bg-indigo-500 hover:bg-indigo-600 text-white font-medium py-2 px-4 rounded-lg shadow-lg transition duration-150 text-sm">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>歷史紀錄</span>
                </button>
            </div>
        </header>
        
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- 左側欄：儀表板與快速輸入 (佔 4 等份) -->
            <div class="lg:col-span-4 space-y-6">
                
                <!-- 儀表板圖表 -->
                <div class="card p-6">
                    <h2 class="text-lg font-bold text-cyan-400 mb-4 flex items-center border-b border-slate-700 pb-2">
                        <svg class="w-5 h-5 mr-2 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 3.055A9.001 9.001 0 1020.945 13H11V3.055z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z"></path></svg>
                        [ANALYSIS] 工作類型比例
                    </h2>
                    <div class="relative h-48">
                        <canvas id="workChart"></canvas>
                        <!-- 無資料時的遮罩 -->
                        <div id="chart-placeholder" class="absolute inset-0 flex items-center justify-center bg-slate-800 bg-opacity-80 text-gray-500 text-sm hidden">
                            尚無今日資料
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4 mt-4 text-center border-t border-slate-700 pt-4">
                        <div class="p-3 bg-slate-700 rounded-lg">
                            <span class="block text-2xl font-extrabold text-blue-400" id="stat-routine">0</span>
                            <span class="text-xs text-gray-400">例行項目 (Routine)</span>
                        </div>
                        <div class="p-3 bg-slate-700 rounded-lg">
                            <span class="block text-2xl font-extrabold text-green-400" id="stat-adhoc">0</span>
                            <span class="text-xs text-gray-400">臨時狀況 (Ad-hoc)</span>
                        </div>
                    </div>
                </div>

                <!-- 記錄臨時事項 (Ad-hoc) - 快速輸入區 -->
                <div class="card p-6 no-print">
                    <h2 class="text-lg font-bold text-cyan-400 mb-3 flex items-center border-b border-slate-700 pb-2">
                        <svg class="w-5 h-5 mr-2 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
                        [QUICK CAPTURE] 臨時事項
                    </h2>
                    <div class="flex flex-col gap-3">
                        <!-- 分類選擇 -->
                        <select id="adhoc-category" class="w-full p-2.5 border border-slate-700 bg-slate-900 rounded-lg text-sm text-gray-100 focus:ring-green-500 focus:border-green-500">
                            <option value="一般">📌 一般事項</option>
                            <option value="會議">🗣️ 會議溝通</option>
                            <option value="維修">🔧 維修/除錯</option>
                            <option value="開發">💻 專案開發</option>
                            <option value="支援">🤝 支援協助</option>
                            <option value="行政">📄 行政處理</option>
                        </select>
                        <input type="text" id="adhoc-task-description" placeholder="發生了什麼事？ (例如：處理入庫單號異常)" class="w-full p-2.5 border border-slate-700 bg-slate-900 rounded-lg text-sm text-gray-100 focus:ring-green-500 focus:border-green-500">
                        <button onclick="logAdHocTask()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-6 rounded-lg shadow-md transition duration-150 text-sm">
                            紀錄 (Log Entry)
                        </button>
                    </div>
                </div>
            </div>

            <!-- 右側主面板：例行任務與時間軸日誌 (佔 8 等份) -->
            <div class="lg:col-span-8 space-y-6">
                
                 <!-- 例行任務清單管理中心 (Routine Task Center) -->
                <div class="card p-6 no-print">
                    <h2 class="text-xl font-bold text-cyan-400 mb-4 flex items-center border-b border-slate-700 pb-2">
                        <svg class="w-6 h-6 mr-2 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                        [ROUTINE CENTER] 例行任務清單
                    </h2>
                    
                    <!-- 任務列表 -->
                    <div id="routine-tasks-list" class="space-y-3 mb-6 max-h-[400px] overflow-y-auto pr-2">
                        <!-- 例行任務將由 JavaScript 載入並以分類收合方式呈現 -->
                        <div class="text-center py-4 text-gray-500 text-sm bg-slate-700 rounded-lg border border-dashed border-slate-600">
                            尚無設定例行任務
                        </div>
                    </div>
                    
                    <!-- 管理/新增例行任務區塊 -->
                    <div class="border-t border-slate-700 pt-4">
                        <div class="flex space-x-2 mb-3">
                            <button onclick="document.getElementById('add-routine-form').classList.toggle('hidden')" class="flex-1 text-sm bg-slate-700 text-gray-200 hover:bg-slate-600 font-medium py-1.5 rounded-lg flex items-center justify-center transition duration-150">
                                <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                                新增任務
                            </button>
                            <button onclick="importRoutineTasks()" class="w-1/4 text-sm bg-indigo-500 text-white hover:bg-indigo-600 font-medium py-1.5 rounded-lg transition duration-150">匯入</button>
                            <button onclick="exportRoutineTasks()" class="w-1/4 text-sm bg-indigo-500 text-white hover:bg-indigo-600 font-medium py-1.5 rounded-lg transition duration-150">匯出</button>
                        </div>
                        
                        <div id="add-routine-form" class="mt-3 space-y-2 hidden bg-slate-700 p-4 rounded-lg border border-cyan-400">
                            <input type="text" id="new-routine-task-category" placeholder="類別 (如: ERP, 報表, 行政)" class="w-full text-sm p-2 border border-slate-600 bg-slate-900 rounded focus:ring-cyan-500 focus:border-cyan-500 outline-none text-gray-100 placeholder-gray-500">
                            <input type="text" id="new-routine-task-name" placeholder="任務名稱 (e.g., 確認GB會科倉)" class="w-full text-sm p-2 border border-slate-600 bg-slate-900 rounded focus:ring-cyan-500 focus:border-cyan-500 outline-none text-gray-100 placeholder-gray-500">
                            <input type="text" id="new-routine-task-notes" placeholder="備註 (選填, e.g., 24550收料單明細表)" class="w-full text-sm p-2 border border-slate-600 bg-slate-900 rounded focus:ring-cyan-500 focus:border-cyan-500 outline-none text-gray-100 placeholder-gray-500">
                            <button onclick="addRoutineTask()" class="w-full bg-cyan-500 text-slate-900 text-sm font-bold py-1.5 rounded hover:bg-cyan-400 transition duration-150">儲存任務</button>
                        </div>
                    </div>
                </div>

                <!-- 時間軸日誌 (核心視覺化區域) -->
                <div class="card p-6 min-h-[500px]">
                    <div class="flex justify-between items-center mb-6 border-b border-slate-700 pb-2">
                        <h2 class="text-xl font-bold text-cyan-400 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            [DAILY LOG] 工作時間軸
                        </h2>
                        <span class="text-xs bg-slate-700 text-gray-400 px-3 py-1 rounded-full font-mono" id="log-count-badge">0 ENTRIES</span>
                    </div>

                    <div id="daily-log-timeline" class="pl-2">
                        <!-- 時間軸內容由 JS 生成 -->
                         <div class="flex flex-col items-center justify-center h-64 text-gray-600">
                            <svg class="w-16 h-16 mb-2 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                            <p>今日尚無紀錄，開始工作吧！</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Footer Info -->
        <div class="mt-8 text-center text-xs text-gray-600 no-print">
            <p>App ID: <span id="app-id-display" class="font-mono"></span> | User ID: <span id="user-id-display" class="font-mono"></span></p>
        </div>

    </div>

    <!-- 歷史紀錄模態視窗 -->
    <div id="history-modal" class="modal-overlay hidden" style="z-index: 150;">
        <div class="modal-content p-0 rounded-xl shadow-2xl w-full max-w-4xl overflow-hidden flex flex-col max-h-[85vh]">
            <div class="bg-indigo-600 p-4 flex justify-between items-center text-white">
                <h2 class="text-xl font-bold flex items-center">
                    <svg class="w-6 h-6 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    歷史紀錄查詢
                </h2>
                <button onclick="closeHistoryModal()" class="text-white hover:text-indigo-200 text-2xl font-light focus:outline-none">&times;</button>
            </div>
            
            <div class="p-6 border-b border-slate-700 bg-slate-700">
                <div class="flex items-center space-x-4">
                    <label for="history-date-picker" class="font-medium text-gray-200">選擇日期:</label>
                    <input type="date" id="history-date-picker" onchange="fetchLogsForDate(this.value)" class="p-2 border border-slate-600 bg-slate-900 rounded-lg text-sm text-gray-100 focus:ring-cyan-500 focus:border-cyan-500">
                </div>
            </div>

            <div class="p-6 overflow-y-auto flex-1">
                 <div id="history-log-entries" class="pl-2">
                    <p class="text-gray-500 text-center py-10">請選擇日期以載入資料。</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 簡報/列印模式模態視窗 -->
    <div id="print-modal" class="modal-overlay hidden" style="z-index: 200;">
        <!-- 使用一個淺色模式的容器來確保列印出來是白色背景 -->
        <div class="modal-content bg-white text-gray-900 rounded-lg shadow-2xl w-full max-w-3xl overflow-hidden">
             <div class="flex justify-between items-center p-4 border-b no-print bg-gray-50">
                <h3 class="font-bold text-gray-700">工作日誌預覽 (按下 Ctrl+P 列印或存為 PDF)</h3>
                <button onclick="document.getElementById('print-modal').classList.add('hidden')" class="text-gray-500 hover:text-gray-800 text-xl">&times;</button>
            </div>
            <div class="p-8 print-area" id="print-content" style="background-color: white;">
                <!-- 內容由 JS 複製 -->
            </div>
        </div>
    </div>

    <!-- 訊息提示視窗 -->
    <div id="message-modal" class="modal-overlay hidden" style="z-index: 300;">
        <div class="modal-content p-6 rounded-xl shadow-2xl w-full max-w-sm text-center">
            <div id="modal-icon" class="mb-4"></div>
            <h3 id="message-modal-title" class="text-xl font-bold mb-2"></h3>
            <p id="message-modal-body" class="mb-6 text-gray-400"></p>
            <div id="message-modal-actions" class="flex justify-center space-x-3"></div>
        </div>
    </div>


    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot, collection, query, where, addDoc, getDocs, setLogLevel, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // 設定 Firebase Debug 日誌
        // setLogLevel('Debug');

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        const LOCAL_FIREBASE_CONFIG = {
            apiKey: "AIzaSyAXnSDK_kY4Aa8XvL0M_Md9kA4Wdow_Uvs",
            authDomain: "daily-23c82.firebaseapp.com",
            projectId: "daily-23c82",
            storageBucket: "daily-23c82.firebasestorage.app",
            messagingSenderId: "574719251457",
            appId: "1:574719251457:web:30aadb364406783b175c00",
            measurementId: "G-6JN0N6BJHH"
        };

        const firebaseConfig = 
            (typeof __firebase_config !== 'undefined' && __firebase_config !== 'null' && __firebase_config.length > 2) 
                ? JSON.parse(__firebase_config) 
                : LOCAL_FIREBASE_CONFIG; 

        let app, db, auth, userId = null, isAuthReady = false;
        let routineTasks = []; // Example: [{ name: "Task A", category: "ERP", notes: "" }]
        let completedRoutineTaskNames = new Set(); 
        let dailyLogs = [];
        let statsChart = null;
        
        // 用於追蹤哪些任務類別是展開的
        let openCategories = new Set(); 
        
        // 設定 Chart.js 預設字體和顏色
        Chart.defaults.color = '#e2e8f0'; // Gray 200
        Chart.defaults.font.family = 'Microsoft YaHei, Microsoft JhengHei, Inter, sans-serif'; // 更新 Chart.js 字體

        /**
         * 將字串淨化為可安全用於 HTML ID 的格式。
         * @param {string} str 
         * @returns {string}
         */
        const sanitizeId = (str) => {
            // 將所有非字母數字字元替換為底線，並移除開頭的底線（如果有的話）
            return str.replace(/[^a-zA-Z0-9]/g, '_').replace(/^_/g, '');
        }

        // --- Chart.js Initialization ---
        const initChart = () => {
            const ctx = document.getElementById('workChart').getContext('2d');
            statsChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['例行工作 (Routine)', '臨時狀況 (Ad-hoc)'],
                    datasets: [{
                        data: [0, 0], // Initial data
                        backgroundColor: ['#60a5fa', '#34d399'], // Blue-400, Green-400
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { 
                            position: 'right', 
                            labels: { 
                                usePointStyle: true,
                                color: '#94a3b8' // Slate 400 for legend text
                            } 
                        },
                        tooltip: {
                            backgroundColor: 'rgba(30, 41, 59, 0.9)', // Slate 800
                            titleColor: '#e2e8f0',
                            bodyColor: '#e2e8f0',
                        }
                    },
                    cutout: '70%',
                }
            });
        };

        const updateChart = () => {
            if (!statsChart) return;
            
            let routineCount = 0;
            let adhocCount = 0;

            dailyLogs.forEach(log => {
                if (log.type === 'Routine') routineCount++;
                else adhocCount++;
            });

            // 更新圖表數據
            statsChart.data.datasets[0].data = [routineCount, adhocCount];
            statsChart.update();

            // 更新數字統計
            document.getElementById('stat-routine').textContent = routineCount;
            document.getElementById('stat-adhoc').textContent = adhocCount;
            document.getElementById('log-count-badge').textContent = `${dailyLogs.length} ENTRIES`;

            // 處理無資料顯示
            const placeholder = document.getElementById('chart-placeholder');
            if (routineCount === 0 && adhocCount === 0) {
                placeholder.classList.remove('hidden');
            } else {
                placeholder.classList.add('hidden');
            }
        };

        // --- UI Utils ---
        window.closeMessageModal = () => document.getElementById('message-modal').classList.add('hidden');

        const showMessage = (type, title, body, onConfirm = null) => {
            const modal = document.getElementById('message-modal');
            const titleEl = document.getElementById('message-modal-title');
            const bodyEl = document.getElementById('message-modal-body');
            const actionsEl = document.getElementById('message-modal-actions');
            const iconEl = document.getElementById('modal-icon');

            titleEl.textContent = title;
            bodyEl.textContent = body;
            actionsEl.innerHTML = '';
            titleEl.className = 'text-xl font-bold mb-2 ' + (type === 'error' ? 'text-red-400' : type === 'success' ? 'text-green-400' : 'text-cyan-400');

            // Icon Setup
            let iconColor, iconPath;
            if (type === 'error') {
                iconColor = 'text-red-400'; iconPath = 'M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z';
            } else if (type === 'confirm' || type === 'warning') {
                iconColor = 'text-yellow-400'; iconPath = 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z';
            } else if (type === 'success') {
                 iconColor = 'text-green-400'; iconPath = 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z';
            } else {
                iconColor = 'text-cyan-400'; iconPath = 'M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z';
            }
            iconEl.innerHTML = `<svg class="w-12 h-12 ${iconColor} mx-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${iconPath}"></path></svg>`;


            // Buttons
            if (onConfirm) {
                const confirmBtn = document.createElement('button');
                confirmBtn.className = "bg-red-600 text-white px-4 py-2 rounded-lg hover:bg-red-700 font-medium";
                confirmBtn.textContent = "確認 (Confirm)";
                confirmBtn.onclick = () => { window.closeMessageModal(); onConfirm(); };
                
                const cancelBtn = document.createElement('button');
                cancelBtn.className = "bg-slate-700 text-gray-200 px-4 py-2 rounded-lg hover:bg-slate-600 font-medium";
                cancelBtn.textContent = "取消 (Cancel)";
                cancelBtn.onclick = window.closeMessageModal;

                actionsEl.appendChild(cancelBtn);
                actionsEl.appendChild(confirmBtn);
            } else {
                const okBtn = document.createElement('button');
                okBtn.className = "bg-cyan-500 text-slate-900 px-6 py-2 rounded-lg hover:bg-cyan-400 font-bold";
                okBtn.textContent = "OK";
                okBtn.onclick = window.closeMessageModal;
                actionsEl.appendChild(okBtn);
            }

            modal.classList.remove('hidden');
        };

        // *** FIX: 使用 ID 替代 DOM 遍歷，解決匯入後可能發生的 null 錯誤 ***
        /**
         * 展開或收合任務類別的內容。
         * @param {HTMLElement} button 點擊的按鈕
         * @param {string} category 類別名稱
         * @param {string} contentId 內容容器的 ID
         * @param {string} iconId 旋轉圖標的 ID
         */
        window.toggleAccordion = (button, category, contentId, iconId) => {
            // 直接通過 ID 獲取元素，這是最可靠的方式
            const content = document.getElementById(contentId);
            const icon = document.getElementById(iconId);
            
            // 關鍵空值檢查: 防止 "Cannot read properties of null (reading 'classList')"
            if (!content || !icon) {
                console.error("Accordion Error: Content or icon element not found for category:", category, { contentId, iconId });
                return;
            }

            if (content.classList.contains('hidden')) {
                // Open
                content.classList.remove('hidden');
                icon.classList.add('rotate-180');
                openCategories.add(category);
            } else {
                // Close
                content.classList.add('hidden');
                icon.classList.remove('rotate-180');
                openCategories.delete(category);
            }
        };

        const getTodayDateString = () => {
            const date = new Date();
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        };
        
        const formatDisplayDate = (dateStr) => {
            const d = new Date(dateStr);
            return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
        };

        const getRoutineTasksDocRef = () => userId ? doc(db, 'artifacts', appId, 'users', userId, 'config', 'routine_tasks') : null;
        const getDailyLogCollectionRef = (dateString = getTodayDateString()) => userId ? collection(db, 'artifacts', appId, 'users', userId, 'daily_logs', dateString, 'entries') : null;

        // --- Firebase Core ---
        const initFirebase = async () => {
            document.getElementById('header-date').textContent = formatDisplayDate(getTodayDateString());
            document.getElementById('app-id-display').textContent = appId;
            document.getElementById('history-date-picker').max = getTodayDateString();

            if (!firebaseConfig?.apiKey) {
                document.getElementById('loading-overlay').innerHTML = `<p class="text-red-400 font-bold text-xl">設定錯誤：缺少 Firebase API Key</p>`;
                return;
            }

            try {
                app = initializeApp(firebaseConfig);
                db = getFirestore(app);
                auth = getAuth(app);
                await setPersistence(auth, browserSessionPersistence);

                if (initialAuthToken) await signInWithCustomToken(auth, initialAuthToken);
                else await signInAnonymously(auth);

                onAuthStateChanged(auth, (user) => {
                    if (user) {
                        userId = user.uid;
                        isAuthReady = true;
                        document.getElementById('user-id-display').textContent = userId;
                        loadRoutineTasks();
                        subscribeToDailyLogs();
                        
                        // UI Transition
                        document.getElementById('loading-overlay').classList.add('opacity-0');
                        setTimeout(() => {
                            document.getElementById('loading-overlay').style.display = 'none';
                            document.getElementById('app-container').style.display = 'block';
                            initChart(); // Initialize chart after container is visible
                        }, 300);
                    }
                });
            } catch (error) {
                console.error("Init Error:", error);
                document.getElementById('loading-overlay').innerHTML = `<p class="text-red-400">系統初始化失敗: ${error.message}</p>`;
            }
        };

        // --- Logic: Routine Tasks (with Category Grouping) ---
        const loadRoutineTasks = () => {
            if (!isAuthReady) return;
            onSnapshot(getRoutineTasksDocRef(), (docSnap) => {
                if (docSnap.exists() && Array.isArray(docSnap.data().tasks)) {
                    routineTasks = docSnap.data().tasks.map(task => ({
                        // Ensure required fields exist
                        name: task.name || '無名稱任務', 
                        category: task.category || '未分類', 
                        notes: task.notes || ''
                    }));
                } else {
                    routineTasks = [];
                }
                renderRoutineTasks(); 
            });
        };

        const saveRoutineTasks = async (tasks) => {
            if (!isAuthReady) return;
            try {
                await setDoc(getRoutineTasksDocRef(), { tasks });
            } catch (e) {
                showMessage('error', '儲存失敗', '無法更新例行任務清單');
            }
        };

        window.addRoutineTask = async () => {
            const category = document.getElementById('new-routine-task-category').value.trim() || '未分類';
            const name = document.getElementById('new-routine-task-name').value.trim();
            const notes = document.getElementById('new-routine-task-notes').value.trim();
            if (!name) return showMessage('error', '錯誤', '任務名稱不可為空');
            
            if (routineTasks.some(t => t.name === name)) return showMessage('error', '重複', '任務名稱已存在');

            await saveRoutineTasks([...routineTasks, { name, category, notes }]);
            document.getElementById('new-routine-task-category').value = '';
            document.getElementById('new-routine-task-name').value = '';
            document.getElementById('new-routine-task-notes').value = '';
        };

        // Deletes by unique name, not by index, to handle sorting/grouping changes
        window.deleteRoutineTaskByName = (taskName) => {
            const taskIndex = routineTasks.findIndex(t => t.name === taskName);
            if (taskIndex === -1) return;
            const task = routineTasks[taskIndex];
            showMessage('confirm', '刪除確認', `確定要永久刪除例行任務「${task.name}」嗎？這將同時刪除今日相關日誌。`, async () => {
                // Cascade delete logs
                const logsToDelete = dailyLogs.filter(l => l.type === 'Routine' && l.taskName === task.name);
                // Note: The delete operation uses the current day's log collection for simplicity. 
                // A more complex system would need to check all days.
                for (const log of logsToDelete) {
                    await deleteDoc(doc(getDailyLogCollectionRef(), log.id));
                }
                // Update list
                const newTasks = routineTasks.filter(t => t.name !== task.name);
                await saveRoutineTasks(newTasks);
            });
        };
        
        // --- Import/Export Logic ---
        window.exportRoutineTasks = () => {
            if (routineTasks.length === 0) {
                return showMessage('info', '無資料', '例行任務清單為空，無需匯出。');
            }
            try {
                const json = JSON.stringify(routineTasks, null, 2);
                const blob = new Blob([json], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                
                const a = document.createElement('a');
                a.href = url;
                a.download = `routine_tasks_export_${getTodayDateString()}.json`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showMessage('success', '匯出成功', '例行任務清單已匯出為 JSON 文件。');
            } catch (e) {
                showMessage('error', '匯出失敗', '匯出過程中發生錯誤。');
            }
        };

        window.importRoutineTasks = () => {
            const fileInput = document.createElement('input');
            fileInput.type = 'file';
            fileInput.accept = 'application/json';
            fileInput.onchange = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const importedData = JSON.parse(event.target.result);
                        if (!Array.isArray(importedData) || importedData.some(item => typeof item.name !== 'string')) {
                            throw new Error('JSON 格式不正確，應為包含 {name, category, notes} 的任務陣列。');
                        }
                        
                        const newTasksMap = new Map();
                        routineTasks.forEach(task => newTasksMap.set(task.name, task));
                        
                        let uniqueCount = 0;
                        importedData.forEach(task => {
                            // 確保任務名稱存在
                            if (!task.name || typeof task.name !== 'string' || task.name.trim() === '') {
                                console.warn("Skipping imported task with invalid name:", task);
                                return;
                            }
                            
                            const validTask = {
                                category: task.category || '未分類',
                                name: task.name.trim(),
                                notes: task.notes || ''
                            };
                            if (!newTasksMap.has(validTask.name)) {
                                newTasksMap.set(validTask.name, validTask);
                                uniqueCount++;
                            }
                        });

                        const newRoutineTasks = Array.from(newTasksMap.values());
                        
                        await saveRoutineTasks(newRoutineTasks);
                        showMessage('success', '匯入成功', `成功匯入 ${uniqueCount} 筆新任務。`);

                    } catch (error) {
                        showMessage('error', '匯入失敗', `檔案解析錯誤或格式不符: ${error.message}`);
                    }
                };
                reader.readAsText(file);
            };
            fileInput.click();
        };

        // --- Logic: Logs ---
        const subscribeToDailyLogs = () => {
            if (!isAuthReady) return;
            onSnapshot(getDailyLogCollectionRef(), (snapshot) => {
                dailyLogs = [];
                completedRoutineTaskNames.clear();
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    dailyLogs.push({ id: doc.id, ...data });
                    if (data.type === 'Routine' && data.taskName) {
                        completedRoutineTaskNames.add(data.taskName);
                    }
                });
                
                dailyLogs.sort((a, b) => b.timestamp - a.timestamp); // Sort Newest First for Timeline
                
                renderTimeline(dailyLogs, document.getElementById('daily-log-timeline'));
                renderRoutineTasks(); // Update checkbox states and redraw list
                updateChart(); // Update dashboard
            });
        };

        window.addLogEntry = async (type, description, taskName = null, category = '一般') => {
            if (!description) return false;
            try {
                await addDoc(getDailyLogCollectionRef(), {
                    type, description, taskName, category,
                    timestamp: Date.now(),
                    timeString: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' })
                });
                return true;
            } catch (e) {
                showMessage('error', '寫入失敗', '無法新增日誌');
                return false;
            }
        };

        window.logAdHocTask = async () => {
            const descInput = document.getElementById('adhoc-task-description');
            const catInput = document.getElementById('adhoc-category');
            if (!descInput.value.trim()) return showMessage('error', '空值', '請輸入描述');
            
            const success = await window.addLogEntry('AdHoc', descInput.value.trim(), null, catInput.value);
            if (success) {
                descInput.value = '';
            }
        };

        window.deleteDailyLog = (id, dateStr) => {
            showMessage('confirm', '刪除日誌', '確定要刪除這筆紀錄嗎？若是例行任務將會變回未完成狀態。', async () => {
                await deleteDoc(doc(getDailyLogCollectionRef(dateStr), id));
                if (dateStr !== getTodayDateString()) fetchLogsForDate(dateStr); // Refresh history if needed
            });
        };

        // --- UI Rendering: Routine Tasks (Grouped by Category) ---
        const renderRoutineTasks = () => {
            const list = document.getElementById('routine-tasks-list');
            list.innerHTML = '';
            
            if (routineTasks.length === 0) {
                list.innerHTML = `<div class="text-center py-4 text-gray-500 text-sm bg-slate-700 rounded-lg border border-dashed border-slate-600">尚無設定例行任務</div>`;
                return;
            }

            const tasksByCategory = routineTasks.reduce((acc, task) => {
                const category = task.category || '未分類';
                if (!acc[category]) {
                    acc[category] = [];
                }
                acc[category].push(task);
                return acc;
            }, {});

            Object.entries(tasksByCategory).forEach(([category, tasks]) => {
                const completedTasksCount = tasks.filter(task => completedRoutineTaskNames.has(task.name)).length;
                const totalTasksCount = tasks.length;
                const progressPercent = totalTasksCount > 0 ? Math.round((completedTasksCount / totalTasksCount) * 100) : 0;
                const isAllDone = completedTasksCount === totalTasksCount;
                
                // 恢復展開狀態
                const isOpened = openCategories.has(category);
                
                // 生成唯一且安全的 ID
                const categoryId = sanitizeId(category);
                const contentId = `content-${categoryId}`;
                const iconId = `icon-${categoryId}`;

                // 視覺化優化 - 類別進度條 (僅在按鈕上顯示)
                const headerBaseClass = 'relative z-10 flex items-center justify-between w-full p-3 text-base font-semibold text-left rounded-lg transition-colors duration-150 border overflow-hidden';
                const headerStyleClass = isAllDone ? 'border-blue-500 hover:border-blue-400' : 'border-slate-700 hover:border-cyan-400';
                const progressColor = isAllDone ? 'bg-blue-600/70' : 'bg-cyan-600/70';
                
                // Accordion header (Category)
                const categoryHeader = document.createElement('div');
                categoryHeader.className = "relative mb-2";

                // *** FIX: 將 contentId 和 iconId 明確傳遞給 toggleAccordion ***
                categoryHeader.innerHTML = `
                    <button onclick="toggleAccordion(this, '${category}', '${contentId}', '${iconId}')" class="${headerBaseClass} ${headerStyleClass}">
                        <!-- 進度條 (Progress Bar) - 放在按鈕內部，作為背景層 -->
                        <div class="absolute inset-0 h-full transition-all duration-300 pointer-events-none" style="width: ${progressPercent}%;">
                            <div class="h-full ${progressColor}"></div>
                        </div>

                        <!-- 內容層 (Content Layer) - 確保文字和按鈕在進度條之上 -->
                        <span class="relative z-20 truncate text-gray-100">${category}</span>
                        <div class="relative z-20 flex items-center space-x-2">
                             <span class="text-sm font-bold ${isAllDone ? 'text-blue-200' : 'text-cyan-200'}">${progressPercent}%</span>
                             <span class="text-sm font-medium ${isAllDone ? 'text-blue-100' : 'text-gray-300'}">(${completedTasksCount}/${totalTasksCount})</span>
                             <svg id="${iconId}" class="w-4 h-4 transform transition-transform duration-300 ${isOpened ? 'rotate-180' : 'rotate-0'}" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                        </div>
                    </button>
                    <!-- 任務列表內容，使用唯一 ID -->
                    <div id="${contentId}" class="space-y-1 p-3 bg-slate-800 border border-slate-700 rounded-b-lg ${isOpened ? '' : 'hidden'}">
                        <!-- Task list content -->
                    </div>
                `;
                list.appendChild(categoryHeader);

                const taskListContainer = categoryHeader.querySelector('div.space-y-1');

                tasks.forEach((task) => {
                    const isDone = completedRoutineTaskNames.has(task.name);
                    
                    // 視覺化優化 - 任務卡片
                    const taskEl = document.createElement('div');
                    taskEl.className = `flex items-center justify-between p-3 rounded-lg border-2 transition-all duration-200 ${isDone 
                        ? 'border-green-700 bg-green-900/20 opacity-70' 
                        : 'border-slate-700 hover:border-cyan-400 bg-slate-700/50'}`;
                    
                    taskEl.innerHTML = `
                        <div class="flex items-center space-x-3 flex-1 overflow-hidden">
                            <div class="relative flex items-center shrink-0">
                                <input type="checkbox" id="task-${task.name}" data-task-name="${task.name}" class="peer h-6 w-6 cursor-pointer appearance-none rounded-md border-2 border-slate-500 shadow-sm checked:bg-cyan-500 checked:border-cyan-500 bg-slate-900 transition-colors duration-200" ${isDone ? 'checked disabled' : ''}>
                                <svg class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-4 h-4 pointer-events-none opacity-0 peer-checked:opacity-100 text-slate-900 transition-opacity duration-200" viewBox="0 0 14 10" fill="none"><path d="M1 5L4.5 8.5L13 1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                            </div>
                            <label for="task-${task.name}" class="truncate text-base font-medium ${isDone ? 'text-gray-500 line-through' : 'text-gray-100'} cursor-pointer select-none">
                                ${task.name}
                                ${task.notes ? `<span class="block text-xs text-gray-400 font-normal mt-0.5">${task.notes}</span>` : ''}
                            </label>
                        </div>
                        ${!isDone ? `<button onclick="deleteRoutineTaskByName('${task.name}')" class="text-gray-600 hover:text-red-500 ml-4 p-1 shrink-0"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>` : ''}
                    `;

                    if (!isDone) {
                        taskEl.querySelector('input').addEventListener('change', async (e) => {
                             e.target.disabled = true;
                             const success = await window.addLogEntry('Routine', `完成: ${task.name} (${category})`, task.name, category);
                             // The next renderRoutineTasks() call, triggered by the log change snapshot, will handle the state update and UI refresh.
                             if (!success) { e.target.disabled = false; e.target.checked = false; }
                        });
                    }
                    taskListContainer.appendChild(taskEl);
                });
            });
        };

        // --- UI Rendering: Timeline ---
        const renderTimeline = (logs, container, isHistory = false, dateStr = getTodayDateString()) => {
            container.innerHTML = '';
            if (logs.length === 0) {
                container.innerHTML = `<div class="flex flex-col items-center justify-center h-64 text-gray-600"><svg class="w-16 h-16 mb-2 text-gray-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg><p>今日尚無紀錄，開始工作吧！</p></div>`;
                return;
            }

            logs.forEach(log => {
                const isRoutine = log.type === 'Routine';
                const dotColor = isRoutine ? 'bg-blue-400 shadow-blue-400' : 'bg-green-400 shadow-green-400';
                const tagColor = isRoutine ? 'bg-blue-900 text-blue-300' : 'bg-green-900 text-green-300';
                const categoryLabel = log.category || (isRoutine ? '例行' : '一般');

                const html = `
                    <div class="timeline-item group">
                        <div class="timeline-dot ${dotColor} shadow-md"></div>
                        <div class="flex flex-col sm:flex-row sm:items-start justify-between bg-slate-800 rounded-lg p-3 border border-slate-700 hover:border-cyan-400 transition-colors">
                            <div class="flex-1">
                                <div class="flex items-center space-x-3 mb-1">
                                    <span class="font-mono font-bold text-cyan-400 text-sm">${log.timeString}</span>
                                    <span class="px-2 py-0.5 rounded text-xs font-medium ${tagColor}">${categoryLabel}</span>
                                </div>
                                <p class="text-gray-100 whitespace-pre-wrap leading-relaxed">${log.description}</p>
                            </div>
                            <button onclick="deleteDailyLog('${log.id}', '${dateStr}')" 
                                class="no-print opacity-0 group-hover:opacity-100 text-gray-500 hover:text-red-500 transition-opacity p-2 sm:mt-0 mt-2 self-end sm:self-start">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
            });
        };

        // --- History & Print ---
        window.showHistoryModal = () => {
            const today = getTodayDateString();
            document.getElementById('history-date-picker').value = today;
            document.getElementById('history-modal').classList.remove('hidden');
            fetchLogsForDate(today);
        };
        window.closeHistoryModal = () => document.getElementById('history-modal').classList.add('hidden');

        window.fetchLogsForDate = async (dateStr) => {
            const container = document.getElementById('history-log-entries');
            container.innerHTML = '<div class="text-center py-4"><div class="animate-spin h-6 w-6 border-2 border-cyan-500 border-t-transparent rounded-full mx-auto"></div></div>';
            
            try {
                const snapshot = await getDocs(getDailyLogCollectionRef(dateStr));
                const logs = [];
                snapshot.forEach(doc => logs.push({ id: doc.id, ...doc.data() }));
                logs.sort((a, b) => a.timestamp - b.timestamp); // Chronological for history
                renderTimeline(logs, container, true, dateStr);
                // Print mode uses white background, so we fix the dot color for history view if it's rendered here
                container.querySelectorAll('.timeline-dot').forEach(dot => {
                     dot.style.backgroundColor = '#1e293b'; // Slate 800
                     dot.style.boxShadow = '0 0 0 3px #0f172a'; // Slate 900
                });
            } catch (e) {
                container.innerHTML = `<p class="text-red-400 text-center">載入失敗: ${e.message}</p>`;
            }
        };

        window.togglePrintView = () => {
            const content = document.getElementById('daily-log-timeline').innerHTML;
            const date = document.getElementById('header-date').textContent;
            const stats = {
                routine: document.getElementById('stat-routine').textContent,
                adhoc: document.getElementById('stat-adhoc').textContent
            };

            const printContainer = document.getElementById('print-content');
            
            // Revert colors for print (white background)
            let printContentHtml = content.replace(/bg-slate-800/g, 'bg-gray-100')
                                          .replace(/bg-slate-700/g, 'bg-gray-200')
                                          .replace(/border-slate-700/g, 'border-gray-300')
                                          .replace(/text-gray-100/g, 'text-gray-800')
                                          .replace(/text-gray-500/g, 'text-gray-600')
                                          .replace(/text-cyan-400/g, 'text-indigo-600')
                                          .replace(/text-blue-300/g, 'text-blue-800')
                                          .replace(/text-green-300/g, 'text-green-800')
                                          .replace(/bg-blue-900/g, 'bg-blue-100')
                                          .replace(/bg-green-900/g, 'bg-green-100');

            printContainer.innerHTML = `
                <div class="mb-6 border-b pb-4 border-gray-300">
                    <h1 class="text-2xl font-bold text-gray-900">工作日誌報表</h1>
                    <p class="text-gray-600">日期: ${date}</p>
                </div>
                <div class="flex space-x-8 mb-8 bg-gray-100 p-4 rounded-lg text-gray-800">
                    <div><span class="text-gray-600 text-sm">例行事項 (Routine):</span> <span class="font-bold text-lg">${stats.routine}</span></div>
                    <div><span class="text-gray-600 text-sm">臨時狀況 (Ad-hoc):</span> <span class="font-bold text-lg">${stats.adhoc}</span></div>
                </div>
                <div class="space-y-4">
                    ${printContentHtml}
                </div>
            `;
            
            // Final cleanup for print-specific styles
            printContainer.querySelectorAll('.no-print').forEach(el => el.remove());
            printContainer.querySelectorAll('.timeline-dot').forEach(dot => {
                 dot.style.backgroundColor = 'white';
                 dot.style.boxShadow = '0 0 0 3px #f3f4f6';
            });
            
            document.getElementById('print-modal').classList.remove('hidden');
        };

        window.onload = initFirebase;
    </script>
</body>
</html>
