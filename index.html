<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日工作日誌 - 戰情室 (含每月任務)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            /* 變更為 Microsoft YaHei (Windows) 和 Microsoft JhengHei (Mac) */
            font-family: 'Microsoft YaHei', 'Microsoft JhengHei', 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #e2e8f0; /* Gray 200 */
        }
        .card {
            background-color: #1e293b; /* Slate 800 */
            border: 1px solid #334155; /* Slate 700 */
            border-radius: 0.75rem; /* rounded-xl */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -1px rgba(0, 0, 0, 0.1);
        }
        /* 自定義捲軸樣式 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a; 
        }
        ::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }
        .line-through-gray {
            text-decoration: line-through;
            color: #64748b; /* Slate 500 */
        }
        /* 避免列印時被裁切 */
        @media print {
            .no-print { display: none !important; }
            .print-break-inside { break-inside: avoid; }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6 lg:p-8">

    <div id="login-overlay" class="fixed inset-0 bg-slate-900 bg-opacity-95 z-50 flex items-center justify-center">
        <div class="card p-8 w-full max-w-md text-center">
            <h2 class="text-2xl font-bold mb-4 text-blue-400">系統登入</h2>
            <p class="mb-4 text-slate-400">請輸入您的用戶 ID 以讀取資料</p>
            <input type="text" id="user-id-input" class="w-full bg-slate-700 border border-slate-600 rounded p-2 mb-4 text-white focus:outline-none focus:border-blue-500" placeholder="例如: user123">
            <button onclick="initializeSystem()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 px-4 rounded transition">
                進入戰情室
            </button>
        </div>
    </div>

    <div id="dashboard" class="max-w-7xl mx-auto hidden">
        
        <header class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-cyan-300">
                    工作日誌戰情室
                </h1>
                <p class="text-slate-400 mt-1 flex items-center gap-2">
                    <span id="current-date">載入中...</span>
                    <span class="text-xs bg-slate-700 px-2 py-0.5 rounded text-blue-300" id="display-user-id"></span>
                </p>
            </div>
            <div class="flex gap-3">
                <button onclick="printReport()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg flex items-center gap-2 transition shadow-lg shadow-indigo-500/20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" />
                    </svg>
                    匯出日報
                </button>
            </div>
        </header>

        <div class="grid grid-cols-12 gap-6">
            
            <div class="col-span-12 lg:col-span-4 flex flex-col gap-6">
                
                <div class="card p-5 flex flex-col h-auto max-h-[500px]" id="memo-section">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                        <h2 class="text-xl font-bold text-yellow-400 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                            </svg>
                            臨時事項 / 備忘錄
                        </h2>
                        <span class="text-xs text-slate-500">Auto-save</span>
                    </div>
                    
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="memo-input" placeholder="輸入臨時事項..." 
                            class="flex-1 bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-yellow-500 transition"
                            onkeypress="if(event.key === 'Enter') addMemo()">
                        <button onclick="addMemo()" class="bg-yellow-600 hover:bg-yellow-500 text-white px-3 py-2 rounded transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg>
                        </button>
                    </div>

                    <div class="flex-1 overflow-y-auto pr-1">
                        <ul id="memo-list" class="space-y-2">
                            </ul>
                    </div>
                </div>

                <div class="card p-5 flex flex-col h-auto max-h-[500px]" id="monthly-section">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                        <h2 class="text-xl font-bold text-purple-400 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
                            </svg>
                            每月/長期任務
                        </h2>
                        <button onclick="resetMonthlyTasks()" class="text-xs bg-slate-700 hover:bg-red-600 text-slate-300 hover:text-white px-2 py-1 rounded transition" title="重置所有任務狀態為未完成">
                            重置進度
                        </button>
                    </div>
                    
                    <div class="flex gap-2 mb-3">
                        <input type="text" id="monthly-input" placeholder="輸入每月或長期目標..." 
                            class="flex-1 bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-purple-500 transition"
                            onkeypress="if(event.key === 'Enter') addMonthlyTask()">
                        <button onclick="addMonthlyTask()" class="bg-purple-600 hover:bg-purple-500 text-white px-3 py-2 rounded transition">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                            </svg>
                        </button>
                    </div>

                    <div class="flex-1 overflow-y-auto pr-1">
                        <ul id="monthly-list" class="space-y-2">
                            </ul>
                    </div>
                </div>

            </div>

            <div class="col-span-12 lg:col-span-8 flex flex-col gap-6">
                
                <div class="card p-5" id="routine-section">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                        <h2 class="text-xl font-bold text-green-400 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            每日例行公事 (Daily Routine)
                        </h2>
                        <div class="text-sm text-slate-400" id="routine-progress">0%</div>
                    </div>

                    <div class="flex gap-2 mb-4 no-print">
                        <input type="text" id="routine-input" placeholder="新增例行公事..." 
                            class="flex-1 bg-slate-900 border border-slate-600 rounded px-3 py-2 text-sm focus:outline-none focus:border-green-500 transition"
                            onkeypress="if(event.key === 'Enter') addRoutine()">
                        <button onclick="addRoutine()" class="bg-green-600 hover:bg-green-500 text-white px-3 py-2 rounded transition">
                            新增
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="routine-list">
                        </div>
                </div>

                <div class="card p-5 flex-1 min-h-[400px]" id="log-section">
                    <div class="flex justify-between items-center mb-4 border-b border-slate-700 pb-2">
                        <h2 class="text-xl font-bold text-blue-400 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            工作日誌時間軸
                        </h2>
                        <span id="log-count-badge" class="bg-blue-900 text-blue-200 text-xs px-2 py-1 rounded-full">0 筆</span>
                    </div>

                    <div class="flex flex-col gap-3 mb-6 no-print">
                        <div class="flex gap-2">
                            <input type="time" id="log-time" class="bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white focus:border-blue-500">
                            <input type="text" id="log-content" placeholder="輸入工作內容..." 
                                class="flex-1 bg-slate-900 border border-slate-600 rounded px-3 py-2 text-white focus:border-blue-500"
                                onkeypress="if(event.key === 'Enter') addLog()">
                        </div>
                        <div class="flex justify-between items-center">
                            <div class="flex gap-2">
                                <span class="text-sm text-slate-500 pt-2">標籤:</span>
                                <button onclick="setTag('會議')" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded">會議</button>
                                <button onclick="setTag('開發')" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded">開發</button>
                                <button onclick="setTag('測試')" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded">測試</button>
                                <button onclick="setTag('雜項')" class="text-xs bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded">雜項</button>
                            </div>
                            <button onclick="addLog()" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-1.5 rounded transition">
                                提交日誌
                            </button>
                        </div>
                    </div>

                    <div class="relative border-l-2 border-slate-700 ml-3 space-y-6 pb-4" id="log-timeline">
                        </div>
                </div>

            </div>
        </div>
    </div>

    <div id="print-modal" class="hidden fixed inset-0 z-[100] bg-white text-black overflow-y-auto">
        <div class="p-8 max-w-4xl mx-auto">
            <div class="flex justify-end no-print mb-4">
                <button onclick="document.getElementById('print-modal').classList.add('hidden')" class="mr-4 px-4 py-2 bg-gray-200 rounded text-gray-800">關閉</button>
                <button onclick="window.print()" class="px-4 py-2 bg-blue-600 text-white rounded">列印 / 存為 PDF</button>
            </div>
            <div id="print-content" class="space-y-6">
                </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // *** 請在此處填入您的 Firebase Config ***
        // 為了安全與功能正常，請使用您原有的 Config 設定
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 全域變數
        let dataUserId = "";
        let routineTasks = [];
        let memoList = [];
        let logList = [];
        let monthlyTasks = []; // NEW: 每月任務數據

        // 暴露給 window 以便 HTML onclick 使用
        window.initializeSystem = initializeSystem;
        window.addRoutine = addRoutine;
        window.toggleRoutine = toggleRoutine;
        window.deleteRoutine = deleteRoutine;
        window.addMemo = addMemo;
        window.deleteMemo = deleteMemo;
        window.addLog = addLog;
        window.deleteLog = deleteLog;
        window.setTag = setTag;
        window.printReport = printReport;
        
        // NEW: 每月任務函數暴露
        window.addMonthlyTask = addMonthlyTask;
        window.toggleMonthlyTask = toggleMonthlyTask;
        window.deleteMonthlyTask = deleteMonthlyTask;
        window.resetMonthlyTasks = resetMonthlyTasks;

        // 輔助：取得今日日期字串 YYYY-MM-DD
        function getTodayDateString() {
            const d = new Date();
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        // 輔助：顯示日期格式
        function formatDisplayDate(dateStr) {
            const d = new Date(dateStr);
            const days = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
            return `${dateStr} (${days[d.getDay()]})`;
        }

        function initializeSystem() {
            const inputId = document.getElementById('user-id-input').value.trim();
            if (!inputId) {
                alert("請輸入 User ID");
                return;
            }
            dataUserId = inputId;
            document.getElementById('display-user-id').textContent = dataUserId;
            document.getElementById('login-overlay').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');

            // 設定預設時間
            const now = new Date();
            document.getElementById('log-time').value = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
            document.getElementById('current-date').textContent = formatDisplayDate(getTodayDateString());

            loadData();
        }

        function loadData() {
            const todayStr = getTodayDateString();

            // 1. 監聽每日例行公事 (路徑: users/{uid}/routineTasks)
            // 注意：例行公事通常是固定的，這裡假設每天重置狀態，但清單內容保留
            // 簡化邏輯：我們讀取 master list，並檢查是否今日已完成
            // 為了簡化，這裡直接存取當日狀態。若要永久保存配置，建議分開存。
            // 這裡沿用簡單邏輯：資料庫直接存當前狀態。
            const routineRef = ref(db, `users/${dataUserId}/routineTasks`);
            onValue(routineRef, (snapshot) => {
                routineTasks = [];
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach(key => {
                        routineTasks.push({ id: key, ...data[key] });
                    });
                }
                renderRoutine();
            });

            // 2. 監聽臨時事項 (路徑: users/{uid}/memos)
            const memoRef = ref(db, `users/${dataUserId}/memos`);
            onValue(memoRef, (snapshot) => {
                memoList = [];
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach(key => {
                        memoList.push({ id: key, ...data[key] });
                    });
                }
                renderMemos();
            });

            // 3. 監聽工作日誌 (路徑: users/{uid}/logs/{date})
            const logRef = ref(db, `users/${dataUserId}/logs/${todayStr}`);
            onValue(logRef, (snapshot) => {
                logList = [];
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach(key => {
                        logList.push({ id: key, ...data[key] });
                    });
                }
                // 排序：時間早到晚
                logList.sort((a, b) => a.time.localeCompare(b.time));
                renderLogs();
            });

            // 4. NEW: 監聽每月/長期任務 (路徑: users/{uid}/monthlyTasks)
            const monthlyRef = ref(db, `users/${dataUserId}/monthlyTasks`);
            onValue(monthlyRef, (snapshot) => {
                monthlyTasks = [];
                const data = snapshot.val();
                if (data) {
                    Object.keys(data).forEach(key => {
                        monthlyTasks.push({ id: key, ...data[key] });
                    });
                }
                renderMonthlyTasks();
            });
        }

        // --- 每日例行公事邏輯 ---
        function renderRoutine() {
            const listEl = document.getElementById('routine-list');
            listEl.innerHTML = '';
            
            let completedCount = 0;
            
            routineTasks.forEach(task => {
                if (task.completed) completedCount++;
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-3 rounded border ${task.completed ? 'bg-slate-800 border-slate-700' : 'bg-slate-700/50 border-slate-600'}`;
                
                div.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} 
                            onchange="toggleRoutine('${task.id}', this.checked)"
                            class="w-5 h-5 rounded border-slate-500 text-green-600 focus:ring-green-500 bg-slate-800 cursor-pointer">
                        <span class="truncate ${task.completed ? 'line-through-gray' : 'text-slate-200'}">${task.text}</span>
                    </div>
                    <button onclick="deleteRoutine('${task.id}')" class="text-slate-500 hover:text-red-400 no-print px-2">
                        &times;
                    </button>
                `;
                listEl.appendChild(div);
            });

            // 更新進度條
            const progressEl = document.getElementById('routine-progress');
            const total = routineTasks.length;
            const percent = total === 0 ? 0 : Math.round((completedCount / total) * 100);
            progressEl.textContent = `${percent}% (${completedCount}/${total})`;
            progressEl.className = percent === 100 ? 'text-green-400 font-bold' : 'text-sm text-slate-400';
        }

        function addRoutine() {
            const input = document.getElementById('routine-input');
            const text = input.value.trim();
            if (!text) return;
            
            const newRef = push(ref(db, `users/${dataUserId}/routineTasks`));
            set(newRef, {
                text: text,
                completed: false
            });
            input.value = '';
        }

        function toggleRoutine(id, isChecked) {
            update(ref(db, `users/${dataUserId}/routineTasks/${id}`), {
                completed: isChecked
            });
        }

        function deleteRoutine(id) {
            if(confirm('確定刪除此例行公事？')) {
                remove(ref(db, `users/${dataUserId}/routineTasks/${id}`));
            }
        }

        // --- 臨時事項邏輯 ---
        function renderMemos() {
            const listEl = document.getElementById('memo-list');
            listEl.innerHTML = '';
            
            memoList.forEach(memo => {
                const li = document.createElement('li');
                li.className = 'flex justify-between items-start bg-slate-800 p-2 rounded border border-slate-700 text-sm';
                li.innerHTML = `
                    <span class="text-yellow-100/90 whitespace-pre-wrap flex-1 mr-2">${memo.text}</span>
                    <button onclick="deleteMemo('${memo.id}')" class="text-slate-500 hover:text-red-400 no-print">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                    </button>
                `;
                listEl.appendChild(li);
            });
        }

        function addMemo() {
            const input = document.getElementById('memo-input');
            const text = input.value.trim();
            if (!text) return;

            const newRef = push(ref(db, `users/${dataUserId}/memos`));
            set(newRef, { text: text });
            input.value = '';
        }

        function deleteMemo(id) {
            remove(ref(db, `users/${dataUserId}/memos/${id}`));
        }

        // --- NEW: 每月/長期任務邏輯 ---
        function renderMonthlyTasks() {
            const listEl = document.getElementById('monthly-list');
            listEl.innerHTML = '';
            
            monthlyTasks.forEach(task => {
                const li = document.createElement('li');
                // 樣式參考 Daily Routine 但稍微緊湊一點
                li.className = `flex items-center justify-between p-2 rounded border mb-1 ${task.completed ? 'bg-slate-800/50 border-slate-700' : 'bg-slate-700/30 border-slate-600'}`;
                
                li.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden w-full">
                        <input type="checkbox" ${task.completed ? 'checked' : ''} 
                            onchange="toggleMonthlyTask('${task.id}', this.checked)"
                            class="w-4 h-4 rounded border-slate-500 text-purple-600 focus:ring-purple-500 bg-slate-800 cursor-pointer">
                        <span class="truncate text-sm ${task.completed ? 'line-through-gray' : 'text-slate-200'}">${task.text}</span>
                    </div>
                    <button onclick="deleteMonthlyTask('${task.id}')" class="text-slate-500 hover:text-red-400 no-print px-1 ml-2">
                        &times;
                    </button>
                `;
                listEl.appendChild(li);
            });
        }

        function addMonthlyTask() {
            const input = document.getElementById('monthly-input');
            const text = input.value.trim();
            if (!text) return;

            const newRef = push(ref(db, `users/${dataUserId}/monthlyTasks`));
            set(newRef, {
                text: text,
                completed: false
            });
            input.value = '';
        }

        function toggleMonthlyTask(id, isChecked) {
            update(ref(db, `users/${dataUserId}/monthlyTasks/${id}`), {
                completed: isChecked
            });
        }

        function deleteMonthlyTask(id) {
            if(confirm('確定刪除此任務？')) {
                remove(ref(db, `users/${dataUserId}/monthlyTasks/${id}`));
            }
        }

        function resetMonthlyTasks() {
            if(!confirm('確定要重置所有每月任務的進度嗎？(任務不會被刪除，只會取消勾選)')) return;
            
            // 批次更新
            const updates = {};
            monthlyTasks.forEach(task => {
                updates[`users/${dataUserId}/monthlyTasks/${task.id}/completed`] = false;
            });
            
            update(ref(db), updates);
        }


        // --- 工作日誌邏輯 ---
        function setTag(tag) {
            const input = document.getElementById('log-content');
            input.value = `【${tag}】 ` + input.value;
            input.focus();
        }

        function renderLogs() {
            const timeline = document.getElementById('log-timeline');
            timeline.innerHTML = '';
            document.getElementById('log-count-badge').textContent = `${logList.length} 筆`;

            logList.forEach(log => {
                const div = document.createElement('div');
                div.className = 'relative pl-8 sm:pl-32 py-2 group';
                
                // 判斷 Tag 顏色
                let tagColor = 'bg-blue-500';
                if (log.content.includes('【會議】')) tagColor = 'bg-red-500';
                else if (log.content.includes('【開發】')) tagColor = 'bg-emerald-500';
                else if (log.content.includes('【測試】')) tagColor = 'bg-amber-500';

                div.innerHTML = `
                    <div class="absolute left-[-5px] top-4 w-3 h-3 ${tagColor} rounded-full border-2 border-slate-900 z-10"></div>
                    
                    <div class="flex flex-col sm:flex-row items-start sm:items-center">
                        <div class="font-mono text-sm text-slate-400 w-24 sm:absolute sm:left-2 sm:text-right mb-1 sm:mb-0">
                            ${log.time}
                        </div>
                        
                        <div class="bg-slate-800 rounded-lg p-3 border border-slate-700 w-full hover:border-blue-500/50 transition">
                            <p class="text-slate-200 whitespace-pre-wrap">${log.content}</p>
                        </div>

                        <button onclick="deleteLog('${log.id}')" class="ml-2 text-slate-600 hover:text-red-400 opacity-0 group-hover:opacity-100 transition no-print">
                            &times;
                        </button>
                    </div>
                `;
                timeline.appendChild(div);
            });
        }

        function addLog() {
            const timeInput = document.getElementById('log-time');
            const contentInput = document.getElementById('log-content');
            
            const time = timeInput.value;
            const content = contentInput.value.trim();
            const todayStr = getTodayDateString();

            if (!time || !content) {
                alert("請填寫時間與內容");
                return;
            }

            const newRef = push(ref(db, `users/${dataUserId}/logs/${todayStr}`));
            set(newRef, {
                time: time,
                content: content
            });
            
            contentInput.value = '';
            // 時間自動加 1 小時方便下一筆，或保持原樣，這裡保持原樣
        }

        function deleteLog(id) {
            const todayStr = getTodayDateString();
            if(confirm('刪除此日誌？')) {
                remove(ref(db, `users/${dataUserId}/logs/${todayStr}/${id}`));
            }
        }

        // --- 列印報表 ---
        function printReport() {
            const printContent = document.getElementById('print-content');
            const printModal = document.getElementById('print-modal');
            
            printContent.innerHTML = '';
            
            // 複製 Routine 區塊
            const routineBlock = document.getElementById('routine-section').cloneNode(true);
            
            // NEW: 複製 Monthly 區塊
            const monthlyBlock = document.getElementById('monthly-section').cloneNode(true);
            
            // 複製 Log 區塊
            // 注意：我們需要調整 Log 區塊在列印時的樣式，可能不需要輸入框
            const logBlock = document.querySelector('#log-section').cloneNode(true);

            [routineBlock, monthlyBlock, logBlock].forEach(block => {
                block.classList.remove('card'); // 移除深色背景樣式以便列印更清晰，或保留依個人喜好
                // 這裡保留 card class 但移除輸入區
                block.querySelectorAll('.no-print').forEach(el => el.remove());
                block.querySelectorAll('button').forEach(el => el.remove());
                block.querySelectorAll('input[type="text"]').forEach(el => el.parentElement?.remove());
                block.querySelectorAll('input[type="time"]').forEach(el => el.parentElement?.remove());
                
                // 確保列印時顏色正確 (Tailwind dark mode print fix)
                block.style.color = '#000';
                block.style.backgroundColor = '#fff';
                block.style.border = '1px solid #ddd';
            });
            
            // 標題修正
            const headerHTML = `
                <div class="text-center mb-6">
                    <h1 class="text-3xl font-extrabold text-gray-800">工作日誌報告</h1>
                    <p class="text-gray-600 mt-1">日期: ${formatDisplayDate(getTodayDateString())}</p>
                    <p class="text-gray-600">用戶 ID: ${dataUserId}</p>
                </div>
            `;

            printContent.innerHTML = headerHTML;
            
            // 依序加入 (這裡使用 Grid 或 Flex 來排版列印頁面)
            const gridContainer = document.createElement('div');
            gridContainer.className = 'grid grid-cols-1 gap-6'; // 列印時通常單欄比較清楚，或維持雙欄
            
            // 加入標題修飾
            const addTitle = (el, title) => {
                const h = el.querySelector('h2'); 
                if(h) h.className = 'text-xl font-bold text-black border-b pb-2 mb-2';
            }

            // Routine
            addTitle(routineBlock);
            printContent.appendChild(routineBlock);

            // Monthly
            addTitle(monthlyBlock);
            printContent.appendChild(monthlyBlock);

            // Logs
            addTitle(logBlock);
            logBlock.querySelector('#log-timeline').classList.remove('ml-3', 'border-l-2'); // 移除時間軸線條簡化列印
            printContent.appendChild(logBlock);
            
            printModal.classList.remove('hidden');
        };
    </script>
</body>
</html>
