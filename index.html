<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Integrated Daily & Calendar Dashboard</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            appBg: '#0f172a',
            panelBg: '#1e293b',
            cyanTheme: '#06b6d4'
          }
        }
      }
    }
  </script>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <link rel="stylesheet" type="text/css" href="https://npmcdn.com/flatpickr/dist/themes/dark.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

  <style>
    body { font-family: 'Inter', 'Microsoft JhengHei', sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
    .custom-scrollbar:hover::-webkit-scrollbar-thumb { background: #64748b; }
    .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.05); }
    
    @keyframes slideIn { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .toast-enter { animation: slideIn 0.3s forwards; }
    @keyframes pulse-cyan { 0%, 100% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0); } 50% { box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.3); } }
    .highlight-panel { animation: pulse-cyan 1.5s ease-in-out; }
  </style>
</head>
<body class="bg-appBg text-slate-200 h-screen overflow-hidden flex flex-col">

  <header class="h-16 flex items-center justify-between px-6 border-b border-slate-800 shrink-0">
    <div class="flex items-center gap-2">
      <h1 class="text-xl font-bold text-white tracking-wide">Integrated Dashboard</h1>
      <span class="text-xs text-slate-500 mt-1 hidden sm:block">Crafted by 勝全 · AI-assisted analytics</span>
    </div>
    <div class="flex items-center gap-3">
      <span class="text-sm text-slate-400 flex items-center gap-1"><i data-lucide="calendar" class="w-4 h-4"></i> <span id="header-date"></span></span>
      <span class="text-xs bg-slate-800 text-cyan-400 px-2 py-1 rounded border border-slate-700 font-mono" id="user-id-display">Connecting...</span>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    
    <aside class="w-20 lg:w-24 border-r border-slate-800 flex flex-col items-center py-6 gap-6 shrink-0 bg-appBg z-10">
      <button class="flex flex-col items-center gap-1.5 text-cyanTheme bg-cyanTheme/10 p-3 rounded-xl w-16">
        <i data-lucide="calendar-days" class="w-6 h-6"></i>
        <span class="text-[10px] font-bold">Calendar</span>
      </button>
      <button onclick="focusTaskCenter()" class="flex flex-col items-center gap-1.5 text-slate-500 hover:text-cyanTheme hover:bg-slate-800 p-3 rounded-xl w-16 transition-colors">
        <i data-lucide="check-square" class="w-6 h-6"></i>
        <span class="text-[10px] font-bold">Tasks</span>
      </button>
      <button onclick="window.location.reload()" class="mt-auto flex flex-col items-center gap-1.5 text-slate-500 hover:text-slate-300 p-3 rounded-xl w-16 transition-colors">
        <i data-lucide="refresh-cw" class="w-6 h-6"></i>
        <span class="text-[10px] font-bold">Refresh</span>
      </button>
    </aside>

    <main class="flex-1 p-4 lg:p-6 overflow-y-auto custom-scrollbar flex flex-col relative">
      <div class="glass-panel rounded-2xl p-4 lg:p-6 flex-1 flex flex-col shadow-2xl min-h-[600px]">
        
        <div class="flex justify-between items-center mb-6">
          <h2 class="text-2xl font-bold text-white flex items-center gap-2" id="current-month-year">YYYY 年 MM 月</h2>
          <div class="flex items-center gap-2 bg-slate-900/50 rounded-lg p-1 border border-slate-700">
            <button onclick="prevMonth()" class="p-1.5 hover:bg-slate-700 rounded text-slate-400"><i data-lucide="chevron-left" class="w-4 h-4"></i></button>
            <button onclick="goToToday()" class="px-2 font-bold text-sm hover:text-cyan-400 transition-colors">今天</button>
            <button onclick="nextMonth()" class="p-1.5 hover:bg-slate-700 rounded text-slate-400"><i data-lucide="chevron-right" class="w-4 h-4"></i></button>
          </div>
        </div>

        <div class="flex-1 border border-slate-700 bg-slate-800/50 rounded-xl overflow-hidden flex flex-col">
          <div class="grid grid-cols-7 border-b border-slate-700 bg-slate-800/80">
            <div class="py-2.5 text-center text-xs font-bold text-red-400">週日</div>
            <div class="py-2.5 text-center text-xs font-bold text-slate-400">週一</div>
            <div class="py-2.5 text-center text-xs font-bold text-slate-400">週二</div>
            <div class="py-2.5 text-center text-xs font-bold text-slate-400">週三</div>
            <div class="py-2.5 text-center text-xs font-bold text-slate-400">週四</div>
            <div class="py-2.5 text-center text-xs font-bold text-slate-400">週五</div>
            <div class="py-2.5 text-center text-xs font-bold text-red-400">週六</div>
          </div>
          <div id="calendar-grid" class="grid grid-cols-7 auto-rows-fr flex-1 bg-slate-900/20"></div>
        </div>
      </div>
    </main>

    <aside id="right-panel" class="w-[320px] lg:w-[360px] p-6 border-l border-slate-800 overflow-y-auto custom-scrollbar glass-panel shadow-2xl shrink-0 z-10 transition-all rounded-l-xl">
      <h2 class="text-xl font-bold text-white mb-6">今日焦點 (Today's Focus)</h2>

      <div class="mb-8">
        <h3 class="text-sm font-bold text-slate-300 mb-3 flex items-center gap-2">1) 快速紀錄 (Quick Capture)</h3>
        <div class="flex gap-2 mb-2">
          <select id="adhoc-category" class="w-1/2 p-2 text-sm bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-cyanTheme text-slate-200">
            <option value="一般">📌 一般事項</option>
            <option value="會議">🗣️ 會議溝通</option>
            <option value="維修">🔧 維修處理</option>
            <option value="開發">💻 專案開發</option>
          </select>
          <input type="text" id="adhoc-requester" placeholder="需求人員(選填)" class="w-1/2 p-2 text-sm bg-slate-900 border border-slate-700 rounded-lg focus:outline-none focus:border-cyanTheme text-slate-200">
        </div>
        <input type="text" id="adhoc-task-description" placeholder="發生了什麼事？" onkeydown="if(event.key === 'Enter') logAdHocTask()" class="w-full p-2 text-sm bg-slate-900 border border-slate-700 rounded-lg mb-2 focus:outline-none focus:border-cyanTheme text-slate-200">
        <button onclick="logAdHocTask()" class="w-full py-2 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white font-bold rounded-lg shadow-md transition-all text-sm">
          紀錄送出 (Log Entry)
        </button>
      </div>

      <div class="mb-8 flex flex-col max-h-[45vh]">
        <div class="flex justify-between items-center mb-3 shrink-0">
          <h3 class="text-sm font-bold text-slate-300 flex items-center gap-2">2) 任務中心 (Task Center)</h3>
          <div class="flex gap-1">
            <button onclick="document.getElementById('add-task-form').classList.toggle('hidden')" class="text-[10px] bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded transition-colors">+ 新增</button>
            <button onclick="importRoutineTasks()" class="text-[10px] bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded transition-colors">匯入</button>
            <button onclick="exportRoutineTasks()" class="text-[10px] bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded transition-colors">匯出</button>
            <input type="file" id="import-file-input" class="hidden" accept=".json">
          </div>
        </div>
        
        <div id="add-task-form" class="hidden mb-3 bg-slate-800 p-3 rounded-lg border border-slate-700 shrink-0">
            <input type="text" id="new-task-name" placeholder="任務名稱" class="w-full mb-2 p-1.5 text-xs bg-slate-900 border border-slate-700 rounded focus:border-cyanTheme text-white">
            <div class="flex gap-2 mb-2">
                <select id="new-task-freq" class="w-1/2 p-1.5 text-xs bg-slate-900 border border-slate-700 rounded text-white">
                    <option value="Daily">每日</option>
                    <option value="Monthly">每月</option>
                </select>
                <input type="text" id="new-task-cat" placeholder="分類" class="w-1/2 p-1.5 text-xs bg-slate-900 border border-slate-700 rounded text-white">
            </div>
            <button onclick="addRoutineTask()" class="w-full py-1.5 bg-cyan-600 hover:bg-cyan-500 text-white font-bold rounded text-xs transition-colors">儲存</button>
        </div>

        <div id="routine-tasks-list" class="space-y-2 overflow-y-auto custom-scrollbar pr-1 flex-1 pb-2">
          </div>
      </div>

      <div class="shrink-0 mt-auto">
        <h3 class="text-sm font-bold text-slate-300 mb-3 flex items-center gap-2">3) 快速分析 (Quick Analysis)</h3>
        <div class="bg-slate-900/50 border border-slate-700 rounded-xl p-4 flex items-center gap-4">
          <div class="w-20 h-20 relative">
             <canvas id="workChart"></canvas>
          </div>
          <div class="flex-1 space-y-2">
            <div class="flex justify-between items-center text-xs">
              <span class="flex items-center gap-1 text-slate-300"><span class="w-2 h-2 rounded-full bg-blue-400"></span> 例行 (Routine)</span>
              <span class="font-bold text-white text-base" id="stat-routine">0</span>
            </div>
            <div class="flex justify-between items-center text-xs">
              <span class="flex items-center gap-1 text-slate-300"><span class="w-2 h-2 rounded-full bg-red-400"></span> 臨時 (Ad-hoc)</span>
              <span class="font-bold text-white text-base" id="stat-adhoc">0</span>
            </div>
          </div>
        </div>
      </div>

    </aside>
  </div>

  <div id="event-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden opacity-0 transition-opacity duration-200">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md shadow-2xl overflow-hidden">
      <div class="px-5 py-4 flex justify-between items-center border-b border-slate-700 bg-slate-900/50">
        <h3 id="event-modal-title" class="text-base font-bold text-white flex items-center gap-2"><i data-lucide="plus" class="w-4 h-4 text-cyan-500"></i> 新增事項</h3>
        <button onclick="closeModal('event-modal')" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form id="event-form" class="p-5 space-y-4">
        <input type="hidden" id="form-id">
        <div class="flex gap-4">
          <div class="flex-1">
            <label class="block text-xs font-bold text-slate-400 mb-1">開始日期</label>
            <input required type="text" id="form-start-date" class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg text-sm text-white focus:border-cyan-500 outline-none">
          </div>
          <div class="flex-1">
            <label class="block text-xs font-bold text-slate-400 mb-1">結束日期</label>
            <input required type="text" id="form-end-date" class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg text-sm text-white focus:border-cyan-500 outline-none">
          </div>
        </div>
        <div class="flex gap-4">
          <div class="flex-1">
            <label class="block text-xs font-bold text-slate-400 mb-1">負責人</label>
            <input required type="text" id="form-name" class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg text-sm text-white focus:border-cyan-500 outline-none" placeholder="例如: 王大明">
          </div>
          <div class="flex-1">
            <label class="block text-xs font-bold text-slate-400 mb-1">標題</label>
            <input required type="text" id="form-title" class="w-full px-3 py-2 bg-slate-900 border border-slate-600 rounded-lg text-sm text-white focus:border-cyan-500 outline-none" placeholder="事項標題">
          </div>
        </div>
        <div class="flex justify-end gap-2 pt-2 border-t border-slate-700">
          <button type="button" onclick="closeModal('event-modal')" class="px-4 py-2 text-sm font-bold text-slate-300 hover:bg-slate-700 rounded-lg">取消</button>
          <button type="submit" class="px-6 py-2 text-sm font-bold bg-cyan-600 hover:bg-cyan-500 text-white rounded-lg shadow-md">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-6 right-6 z-[70] flex flex-col gap-3 pointer-events-none"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const LOCAL_FIREBASE_CONFIG = {
        apiKey: "AIzaSyAXnSDK_kY4Aa8XvL0M_Md9kA4Wdow_Uvs",
        authDomain: "daily-23c82.firebaseapp.com",
        projectId: "daily-23c82",
        storageBucket: "daily-23c82.firebasestorage.app",
        messagingSenderId: "574719251457",
        appId: "1:574719251457:web:30aadb364406783b175c00"
    };

    const app = initializeApp(LOCAL_FIREBASE_CONFIG);
    const auth = getAuth(app);
    const db = getFirestore(app);

    window.appState = {
        currentDate: new Date(),
        todayStr: '',
        userId: null,
        
        calGlobalAppId: 'daily-23c82-app',
        department: localStorage.getItem('calendar_saved_dept') || 'public',
        events: [],
        unsubEvents: null,

        logAppId: 'default-app-id',
        routineTasks: [],
        monthlyTaskStatus: {},
        dailyLogs: [],
        completedRoutineTaskNames: new Set(),
        unsubRoutine: null,
        unsubMonthly: null,
        unsubLogs: null,
        statsChart: null
    };

    const formatToYYYYMMDD = (date) => {
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        return `${yyyy}${mm}${dd}`;
    };
    const formatToDash = (date) => {
        const yyyy = date.getFullYear();
        const mm = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
    };
    
    window.appState.todayStr = formatToYYYYMMDD(new Date());
    document.getElementById('header-date').textContent = formatToDash(new Date());

    window.showToast = (message, type = 'success') => {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        const bgColor = type === 'success' ? 'bg-slate-800 border border-cyan-500' : 'bg-red-900 border border-red-500';
        toast.className = `flex items-center gap-2.5 px-4 py-3 rounded-lg shadow-xl font-bold text-sm text-white toast-enter pointer-events-auto ${bgColor}`;
        toast.innerHTML = `<span>${message}</span>`;
        container.appendChild(toast);
        setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 3000);
    };

    window.openModal = (id) => {
        const modal = document.getElementById(id);
        modal.classList.remove('hidden');
        setTimeout(() => modal.classList.remove('opacity-0'), 10);
    };
    window.closeModal = (id) => {
        const modal = document.getElementById(id);
        modal.classList.add('opacity-0');
        setTimeout(() => modal.classList.add('hidden'), 200);
    };

    window.focusTaskCenter = () => {
        const panel = document.getElementById('right-panel');
        panel.classList.remove('highlight-panel');
        void panel.offsetWidth; 
        panel.classList.add('highlight-panel');
        showToast('目前已在主控制台', 'success');
    };

    Chart.defaults.color = '#cbd5e1';
    Chart.defaults.font.family = 'Inter, sans-serif';
    
    const initChart = () => {
        const ctx = document.getElementById('workChart').getContext('2d');
        window.appState.statsChart = new Chart(ctx, {
            type: 'doughnut',
            data: { labels: ['Routine', 'Ad-hoc'], datasets: [{ data: [0, 0], backgroundColor: ['#60a5fa', '#f87171'], borderWidth: 0, cutout: '75%' }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { backgroundColor: 'rgba(30, 41, 59, 0.9)' } } }
        });
    };

    const updateChart = () => {
        if (!window.appState.statsChart) return;
        let routineCount = 0; let adhocCount = 0;
        window.appState.dailyLogs.forEach(log => {
            if (log.type === 'Routine' || log.type === 'Monthly') routineCount++; 
            else adhocCount++;
        });
        window.appState.statsChart.data.datasets[0].data = [routineCount, adhocCount];
        window.appState.statsChart.update();
        document.getElementById('stat-routine').textContent = routineCount;
        document.getElementById('stat-adhoc').textContent = adhocCount;
    };


    const setupCalendarListeners = () => {
        if (window.appState.unsubEvents) window.appState.unsubEvents();
        const deptKey = window.appState.department.toLowerCase();
        const eventsRef = collection(db, 'artifacts', window.appState.calGlobalAppId, 'public', 'data', `events_${deptKey}`);
        
        window.appState.unsubEvents = onSnapshot(eventsRef, (snapshot) => {
            window.appState.events = [];
            snapshot.forEach(doc => window.appState.events.push({ id: doc.id, ...doc.data() }));
            renderCalendar();
        });
    };

    window.prevMonth = () => { window.appState.currentDate = new Date(window.appState.currentDate.getFullYear(), window.appState.currentDate.getMonth() - 1, 1); renderCalendar(); };
    window.nextMonth = () => { window.appState.currentDate = new Date(window.appState.currentDate.getFullYear(), window.appState.currentDate.getMonth() + 1, 1); renderCalendar(); };
    window.goToToday = () => { window.appState.currentDate = new Date(); renderCalendar(); };

    const renderCalendar = () => {
        const grid = document.getElementById('calendar-grid');
        grid.innerHTML = '';
        const year = window.appState.currentDate.getFullYear();
        const month = window.appState.currentDate.getMonth();
        document.getElementById('current-month-year').textContent = `${year} 年 ${month + 1} 月`;
        
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const firstDay = new Date(year, month, 1).getDay();
        const days = [];
        
        for (let i = 0; i < firstDay; i++) days.push({ date: new Date(year, month, -firstDay + i + 1), isCurrent: false });
        for (let i = 1; i <= daysInMonth; i++) days.push({ date: new Date(year, month, i), isCurrent: true });
        const remainingDays = 42 - days.length; 
        for (let i = 1; i <= remainingDays; i++) days.push({ date: new Date(year, month + 1, i), isCurrent: false });

        days.forEach(dayObj => {
            const dateStr = formatToYYYYMMDD(dayObj.date);
            const isToday = dateStr === window.appState.todayStr;
            const isCurrentMonth = dayObj.isCurrent;

            const dayEvents = window.appState.events.filter(e => {
                const endStr = e.endDateString || e.dateString;
                return dateStr >= e.dateString && dateStr <= endStr;
            });

            const cell = document.createElement('div');
            const bgClass = isCurrentMonth ? 'bg-transparent' : 'bg-slate-900/40 opacity-60';
            cell.className = `min-h-[100px] border-r border-b border-slate-700 p-1.5 cursor-pointer hover:bg-slate-700/50 transition-colors flex flex-col ${bgClass}`;
            cell.onclick = () => openAddEventModal(dayObj.date);
            
            let eventsHtml = dayEvents.map(evt => {
                return `<div class="px-1.5 py-0.5 rounded text-[10px] font-bold truncate mb-1 shadow-sm bg-cyan-600/80 text-white">${evt.name}: ${evt.title}</div>`;
            }).join('');

            cell.innerHTML = `
              <div class="flex justify-center mb-1">
                <div class="w-6 h-6 flex items-center justify-center rounded-full text-xs font-bold ${isToday ? 'bg-cyan-500 text-white shadow-md' : 'text-slate-400'}">${dayObj.date.getDate()}</div>
              </div>
              <div class="flex-1 overflow-y-auto custom-scrollbar">${eventsHtml}</div>
            `;
            grid.appendChild(cell);
        });
    };

    window.openAddEventModal = (dateObj) => {
        const dateStr = formatToDash(dateObj);
        document.getElementById('form-id').value = '';
        document.getElementById('form-start-date')._flatpickr.setDate(dateStr);
        document.getElementById('form-end-date')._flatpickr.setDate(dateStr);
        document.getElementById('form-title').value = '';
        openModal('event-modal');
    };

    document.getElementById('event-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const sDateStr = document.getElementById('form-start-date').value.replace(/-/g, '');
        const eDateStr = document.getElementById('form-end-date').value.replace(/-/g, '');
        const finalEndDate = eDateStr < sDateStr ? sDateStr : eDateStr;

        const payload = {
            dateString: sDateStr,
            endDateString: finalEndDate,
            title: document.getElementById('form-title').value.trim(),
            name: document.getElementById('form-name').value.trim(),
            isAllDay: true, categoryId: 'default', updatedAt: new Date().toISOString()
        };
        const deptKey = window.appState.department.toLowerCase();
        
        await addDoc(collection(db, 'artifacts', window.appState.calGlobalAppId, 'public', 'data', `events_${deptKey}`), payload);
        showToast('已建立行事曆事項');
        closeModal('event-modal');
    });

    const getLogDocRef = (path) => doc(db, 'artifacts', window.appState.logAppId, 'users', window.appState.userId, 'config', path);
    const getLogColRef = (dateStr) => collection(db, 'artifacts', window.appState.logAppId, 'users', window.appState.userId, 'daily_logs', dateStr, 'entries');

    const setupDailyLogListeners = () => {
        if (window.appState.unsubRoutine) window.appState.unsubRoutine();
        if (window.appState.unsubMonthly) window.appState.unsubMonthly();
        if (window.appState.unsubLogs) window.appState.unsubLogs();

        window.appState.unsubRoutine = onSnapshot(getLogDocRef('routine_tasks'), (docSnap) => {
            window.appState.routineTasks = docSnap.exists() && Array.isArray(docSnap.data().tasks) ? docSnap.data().tasks : [];
            renderRoutineTasks();
        });

        window.appState.unsubMonthly = onSnapshot(getLogDocRef('monthly_status'), (docSnap) => {
            window.appState.monthlyTaskStatus = docSnap.exists() ? docSnap.data() : {};
            renderRoutineTasks();
        });

        const todayDash = formatToDash(new Date());
        window.appState.unsubLogs = onSnapshot(getLogColRef(todayDash), (snapshot) => {
            window.appState.dailyLogs = [];
            window.appState.completedRoutineTaskNames.clear();
            snapshot.forEach(d => {
                const data = d.data();
                window.appState.dailyLogs.push({ id: d.id, ...data });
                if ((data.type === 'Routine' || data.type === 'Monthly') && data.taskName) {
                    window.appState.completedRoutineTaskNames.add(data.taskName);
                }
            });
            renderRoutineTasks();
            updateChart();
        });
    };

    window.addRoutineTask = async () => {
        const name = document.getElementById('new-task-name').value.trim();
        const freq = document.getElementById('new-task-freq').value;
        const cat = document.getElementById('new-task-cat').value.trim() || '未分類';
        
        if (!name) return showToast('任務名稱不可為空', 'error');
        if (window.appState.routineTasks.some(t => t.name === name)) return showToast('任務已存在', 'error');

        const newTasks = [...window.appState.routineTasks, { name, category: cat, frequency: freq }];
        await setDoc(getLogDocRef('routine_tasks'), { tasks: newTasks });
        
        document.getElementById('new-task-name').value = '';
        document.getElementById('add-task-form').classList.add('hidden');
        showToast('任務已新增');
    };

    window.exportRoutineTasks = () => {
        if (window.appState.routineTasks.length === 0) return showToast('無資料可匯出', 'error');
        const json = JSON.stringify(window.appState.routineTasks, null, 2);
        const blob = new Blob([json], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `tasks_export_${formatToYYYYMMDD(new Date())}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('匯出成功');
    };

    window.importRoutineTasks = () => {
        const fileInput = document.getElementById('import-file-input');
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    const importedData = JSON.parse(event.target.result);
                    if (!Array.isArray(importedData)) throw new Error('格式錯誤');
                    
                    const newTasksMap = new Map();
                    window.appState.routineTasks.forEach(t => newTasksMap.set(t.name, t));
                    
                    importedData.forEach(task => {
                        if (task.name && !newTasksMap.has(task.name)) {
                            newTasksMap.set(task.name, { name: task.name.trim(), category: task.category || '未分類', frequency: task.frequency || 'Daily' });
                        }
                    });
                    
                    await setDoc(getLogDocRef('routine_tasks'), { tasks: Array.from(newTasksMap.values()) });
                    showToast('匯入成功');
                } catch (error) {
                    showToast('匯入失敗', 'error');
                }
            };
            reader.readAsText(file);
        };
        fileInput.click();
    };

    const handleTaskCompletion = async (taskName, isMonthly, category) => {
        if (isMonthly) {
            const newStatus = { ...window.appState.monthlyTaskStatus, [taskName]: Date.now() };
            await setDoc(getLogDocRef('monthly_status'), newStatus);
        }
        await addDoc(getLogColRef(formatToDash(new Date())), {
            type: isMonthly ? 'Monthly' : 'Routine',
            description: `完成: ${taskName}`,
            taskName: taskName,
            category: category,
            timestamp: Date.now()
        });
        showToast('任務已完成！');
    };

    const renderRoutineTasks = () => {
        const list = document.getElementById('routine-tasks-list');
        list.innerHTML = '';
        if (window.appState.routineTasks.length === 0) {
            list.innerHTML = `<div class="text-xs text-slate-500 text-center py-4">無任務資料</div>`;
            return;
        }

        window.appState.routineTasks.forEach((task, index) => {
            const isMonthly = task.frequency === 'Monthly';
            const isDone = isMonthly ? !!window.appState.monthlyTaskStatus[task.name] : window.appState.completedRoutineTaskNames.has(task.name);
            const inputId = `chk-${index}`;
            
            const taskEl = document.createElement('div');
            taskEl.className = `bg-slate-900/50 border ${isDone ? 'border-cyan-700 opacity-60' : 'border-slate-700'} p-2.5 rounded-lg flex items-start gap-2 transition-all cursor-pointer`;
            
            taskEl.innerHTML = `
                <div class="relative flex items-center shrink-0 mt-0.5">
                    <input type="checkbox" id="${inputId}" class="peer h-4 w-4 cursor-pointer appearance-none rounded border-slate-500 checked:bg-cyan-500 checked:border-cyan-500 bg-slate-800 transition-colors" ${isDone ? 'checked disabled' : ''}>
                    <svg class="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 w-3 h-3 pointer-events-none opacity-0 peer-checked:opacity-100 text-slate-900" viewBox="0 0 14 10" fill="none"><path d="M1 5L4.5 8.5L13 1" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </div>
                <div class="flex-1">
                    <label for="${inputId}" class="text-sm font-medium ${isDone ? 'text-slate-500 line-through' : 'text-slate-200'} cursor-pointer block">${task.name}</label>
                    <p class="text-[10px] ${isMonthly ? 'text-emerald-400' : 'text-blue-400'} font-mono mt-0.5">${task.frequency} · ${task.category}</p>
                </div>
            `;
            
            if (!isDone) {
                const checkbox = taskEl.querySelector('input');
                checkbox.addEventListener('change', (e) => {
                    e.target.disabled = true;
                    handleTaskCompletion(task.name, isMonthly, task.category);
                });
            }
            list.appendChild(taskEl);
        });
    };

    window.logAdHocTask = async () => {
        const descInput = document.getElementById('adhoc-task-description');
        const catInput = document.getElementById('adhoc-category');
        const reqInput = document.getElementById('adhoc-requester');
        
        if (!descInput.value.trim()) return showToast('請輸入事項內容', 'error');

        await addDoc(getLogColRef(formatToDash(new Date())), {
            type: 'AdHoc',
            description: descInput.value.trim(),
            category: catInput.value,
            requester: reqInput.value.trim(),
            timestamp: Date.now()
        });
        
        descInput.value = ''; reqInput.value = '';
        showToast('已紀錄臨時事項');
    };

    const initApp = () => {
        flatpickr("#form-start-date", { dateFormat: "Y-m-d", disableMobile: "true" });
        flatpickr("#form-end-date", { dateFormat: "Y-m-d", disableMobile: "true" });
        initChart();
        lucide.createIcons();

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                const customId = localStorage.getItem('custom_user_id');
                window.appState.userId = customId || user.uid;
                
                const displayId = customId ? `${customId} (Custom)` : user.uid.substring(0,6);
                document.getElementById('user-id-display').textContent = displayId;
                
                setupCalendarListeners();
                setupDailyLogListeners();
            }
        });

        signInAnonymously(auth).catch(e => showToast('登入失敗: ' + e.message, 'error'));
    };

    window.addEventListener('DOMContentLoaded', initApp);

  </script>
</body>
</html>
